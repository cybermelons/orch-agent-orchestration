  function href(slug, issue) {
    return "#/" + encodeURIComponent(slug) + (issue != null ? "/" + issue : "");
  }

  // ---- shape 3.1: the entity row --------------------------------------
  // [mark] [identity] [status/what] [age] [verbs 0-2]. Declared variance,
  // not per-view exceptions: mark optional, status optional, verbs 0-2.
  // `cls` carries the weight variant (lite = secondary, loud = needs-you).
  // `attrs` is a raw attribute string (e.g. ` data-t="rpX"`), the same
  // mechanism sectionHead uses for its own toggle attribute -- callers that
  // need a wrapper attribute pass it in here rather than string-patching the
  // HTML this function returns (#160: the repo-row fold needs this).
  function entityRow(o) {
    // orch#289 (part 4): `sub` is an optional journal-tail line rendered as a
    // second grid row (see .er.has-sub in the stylesheet). Absent for every
    // existing caller, so their markup is unchanged byte-for-byte.
    return '<div class="er' + (o.cls ? " " + o.cls : "") + (o.sub ? " has-sub" : "") + '"' + (o.attrs || "") + ">" +
      '<span class="er-mark">' + (o.mark || "") + "</span>" +
      '<span class="er-id">' + (o.id || "") + "</span>" +
      '<span class="er-what">' + (o.what || "") + "</span>" +
      '<span class="er-age">' + esc(o.age == null ? "" : o.age) + "</span>" +
      (o.verbs ? '<span class="er-verbs">' + o.verbs + "</span>" : "") +
      (o.sub ? '<span class="er-sub">' + o.sub + "</span>" : "") +
      "</div>";
  }

  // ---- shape 3.2: the log row -----------------------------------------
  // [time] [actor] [message]. Time LEADS: it is the identity of the entry.
  // The one prose clamp for row sub-lines: PR #334 established
  // slice-then-escape at 140 for the issue row's brief; orch#415's repo-row
  // latest-act sub-line (repoActSub) reuses it rather than picking a second
  // number. Caller escapes.
  function clip(s) {
    s = String(s == null ? "" : s);
    return s.length > 140 ? s.slice(0, 140) + "…" : s;
  }
  // A journal row's human line: the event plus whatever prose the row
  // carries. A row is {at, actor, event, ...extra}; `note`/`summary` are the
  // extras that hold text, anything else is machine bookkeeping that does
  // not belong in a readable line. One home, read by JOURNAL and, since
  // orch#415, the repo row's own latest-act sub-line (repoActSub).
  function logMsg(row) {
    var msg = String((row && row.event) || "");
    var extra = row && (row.summary || row.note);
    if (extra) msg += " — " + String(extra).split("\n")[0];
    return msg;
  }
  // orch#415: the issue brief sub-line, ONE home for both the repo page
  // (issue row, ~:1660) and the machine page (repoIssueRows) so a brief can
  // never render differently -- or disagree on `stale` -- between the two.
  // brief is the same {text, stale} shape both pages already read
  // (core.issue_brief); absent/empty text is an honest blank, same rule as
  // above -- never an empty sub-line. `stale` reuses the exact badge the
  // issue page's own brief row already uses (:CHECKING pill, see defList
  // below) rather than inventing a second "this is old" visual language.
  function briefSub(i) {
    var text = i.brief && i.brief.text;
    if (!text) return "";
    return esc(clip(text)) +
      (i.brief.stale ? ' <span class="s CHECKING">stale</span>' : "");
  }
  function logRow(time, actor, msg) {
    return '<div class="lg"><span class="lg-time">' + esc(time) + "</span>" +
      '<span class="lg-actor">' + esc(actor) + "</span>" +
      '<span class="lg-msg">' + esc(msg) + "</span></div>";
  }
  // The gap marker: this shape's divider. Full-width, no cells, cannot break.
  function gapRow(sec) {
    return '<div class="lg-gap">—— ' + esc(span(sec)) + " gap — no ticks recorded ——</div>";
  }

  // ---- shape 3.3: the definition pair ---------------------------------
  // [label] [value]. Fold-free by construction; no media query touches it.
  function defList(pairs) {
    return '<dl class="dl">' + pairs.map(function (p) {
      return "<dt>" + esc(p[0]) + "</dt><dd>" + p[1] + "</dd>";
    }).join("") + "</dl>";
  }

  // ---- shape 3.4: the section header ----------------------------------
  // [title (count)] [controls]. Headers own the controls that govern their
  // rows. `tid` makes the header a disclosure toggle for the block below.
  function sectionHead(title, count, controls, cls, tid) {
    return '<div class="sh' + (cls ? " " + cls : "") + (tid ? " toggle" : "") + '"' +
      (tid ? ' data-t="' + esc(tid) + '"' : "") + ">" +
      '<span class="sh-t">' + esc(title) +
      (count == null ? "" : " (" + count + ")") + "</span>" +
      (controls ? '<span class="sh-c">' + controls + "</span>" : "") + "</div>";
  }

  // ---- shape 3.5: furniture -------------------------------------------
  function furniture(text, cls) {
    return '<div class="fu' + (cls ? " " + cls : "") + '">' + text + "</div>";
  }

  // The nav bar's right-hand side: the age readout and the reload button.
  // ONE emission site for all three pages on purpose. The reload button is
  // the control an operator reaches for when the page itself looks wrong, so
  // a second copy that drifts (hidden on one route, disabled on another) is
  // the #66 failure with extra steps -- and orch/test_core.py pins this file
  // to exactly one reload-button id line for that reason (the check counts
  // occurrences, so do not spell the id in a comment either). `extra` is
  // where a page slots its own controls (the repo page's nudge) first.
  function navRight(extra) {
    return '<span class="right"><span class="m" id="age"></span>' + (extra || "") +
      '<button id="btn-reload" title="re-fetch the dashboard data now, instead of waiting for the next poll">reload</button></span>';
  }

  // The ONE resolution of an issue's displayed state, for every page.
  //
  // #87 established the rule: state and work_state are two resolutions of one
  // fact, so one pill carries both. work_state is the finer axis and wins by
  // default -- but it is derived from the branch and the PR alone (core.py
  // work_state), while state is derived from labels alone (core.py
  // issue_state), and NOTHING couples the two. So work_state cannot express
  // UNCLAIMED or ABANDONED, and state must win for those.
  //
  // This lives in a function rather than inline in a row loop because the
  // machine page, the repo page and the issue page all render a pill for the
  // SAME issue. While the rule was inline, one zone could not reach it and
  // used raw work_state: an issue whose PR is red (work_state BLOCKED) and
  // whose label says agent-stuck (state ABANDONED) rendered two different
  // colours on one screen for one issue. The rule has exactly one home.
  function pillState(i) {
    return (i.state === "ABANDONED" || i.state === "UNCLAIMED")
      ? i.state : i.work_state;
  }
  // The repo row's count, in orch#386's words -- working · awaiting ·
  // orphaned · stale -- replacing the old cell that counted issue ROWS
  // and so printed 11 for 2 live sessions (the misread #386 filed; the
  // test suite pins that the old wording is gone). One derivation with one home, called from the machine page's
  // repo row and the repo page's header: the pillState lesson above.
  // `stalled` (#301) stays the repo-level red dot; it is not a fifth bucket.
  // Predicates are the spec's (DASHBOARD-2026-09-17 §4.2), on fields every
  // issue row already carries; an issue matching none counts nowhere.
  function bucketOf(i) {
    if (i.orch_alive) return "working";
    var ws = i.work_state;
    var atPr = ws === "REVIEW" || ws === "CHECKING" || ws === "BLOCKED";
    // orch#425: a dead owner sitting at REVIEW/CHECKING/BLOCKED with a PR
    // read identical to a healthy merge-wait -- orch#408 sat 2.5h dead and
    // the dashboard never showed it. Past the idle threshold (the feed's
    // own nudge_idle_mins, section 7's NUDGE_IDLE_MINS global; -1 "unknown"
    // fails >= on purpose) it moves from awaiting into stale. NOTE: unlike
    // every other bucket here, this predicate is TIME-DEPENDENT -- the
    // count can flip with no state change, purely because a clock ticked
    // past the threshold. Flagged in review; keeping the caveat on record.
    var deadStale = i.idle_min >= (typeof NUDGE_IDLE_MINS === "number" ? NUDGE_IDLE_MINS : 30);
    if (i.pr && atPr && !deadStale) return "awaiting";
    if (ws === "LANDED") return "orphaned";
    if ((!i.pr && (ws === "CLAIMED" || ws === "ACTIVE")) || (i.pr && atPr && deadStale)) return "stale";
    return null;
  }
  function repoCounts(r) {
    var n = { working: 0, awaiting: 0, orphaned: 0, stale: 0 };
    (r.issues || []).forEach(function (i) { var b = bucketOf(i); if (b) n[b]++; });
    // `working` renders the feed's live_orchs -- the ledger (PR #389 ruled
    // it the numerator), which the widget had ignored. Per-row orch_alive
    // is the same fact seen from the row; the two should agree, and when a
    // feed predates the field the row-derived count stands in.
    if (typeof r.live_orchs === "number") n.working = r.live_orchs;
    var parts = ["working", "awaiting", "orphaned", "stale"].filter(function (k) { return n[k] > 0; })
      .map(function (k) { return n[k] + " " + k; });
    return parts.length ? parts.join(" · ") : "idle";
  }
  function pill(st) {
    return '<span class="s ' + esc(st || "UNCLAIMED") + '">' + esc(st || "UNCLAIMED") + "</span>";
  }
  // An issue's identity cell links to its ISSUE PAGE, not to the forge: the
  // page is the drill-down (section 2, deep links), and the forge link is a
  // verb on the issue page where it belongs.
  function issueLink(slug, i) {
    return '<a href="' + esc(href(slug, i.issue)) + '">#' + esc(i.issue) + "</a>";
  }

  // ---- verb buttons ----------------------------------------------------
  // Every verb the pages emit goes through here so the two-tier rule (#66)
  // is applied in one place: ALWAYS emitted, CAN_ACT decides only disabled,
  // ACT_REASON is the title text saying why.
  function verbTail(file, sink, id) {
    // Always emitted, even with no log file: the operator learns this session
    // has nothing to tail, instead of guessing why the button is missing.
    // The session id is in the accessible name because a SESSIONS block
    // renders one of these per row: "tail" alone would announce every row
    // identically, which is the ambiguity the icon conversion had to avoid.
    var label = "tail" + (id ? " " + id : "");
    var attrs = actAttrsIf(!file, "this session has no log file to tail");
    var titleAttr = attrs ? "" : ' title="' + esc(label) + '"';
    return '<button data-act=\'' +
      esc(JSON.stringify({ action: "tail", file: file || "" })) + '\'' +
      (sink ? ' data-sink="' + esc(sink) + '"' : "") +
      attrs + titleAttr + ' aria-label="' + esc(label) + '"><span aria-hidden="true">☰</span></button>';
  }
  // `log` (the run log, by ledger key) is now a real action (orch#151's
  // server unit added it to ACTIONS). Unlike verbTail this is not
  // session-scoped -- a run log is "all runs of this key" (design's own
  // words), so this lives in the RUN LOG section header, not in a per-
  // session entityRow, and it posts repo/issue rather than a file. It
  // calls act() directly (not the generic [data-act] delegated handler)
  // because it needs the decoded BODY to render structured rows, not just
  // the done/failed button text act() already writes -- exactly the
  // chained-promise use act()'s own comment (~601) anticipates.
  function verbLog(slug, issue, sink) {
    var label = "log #" + issue;
    return '<button data-run-log=\'' +
      esc(JSON.stringify({ action: "log", repo: slug, issue: issue })) +
      '\' data-sink="' + esc(sink) + '" title="' + esc(label) + '" aria-label="' + esc(label) +
      '"><span aria-hidden="true">≡</span></button>';
  }
  // The live form is an <a> styled as a button, NOT a <button> wrapped in an
  // <a>: interactive content may not nest, so the old shape was invalid HTML
  // and left the click target ambiguous. `.btn` carries the button styling so
  // the two forms still look identical side by side in a verbs row.
  function verbLink(url, label, deadReason) {
    return url
      ? '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(label) + " ↗</a>"
      : "<button disabled title=\"" + esc(deadReason) + '">' + esc(label) + " ↗</button>";
  }
  // orch#161: the PR is an attribute of the issue row, not a separate row --
  // this is the one place that says so. Both list rows and needsYouVerb
  // reach it so the dead-reason wording cannot drift between call sites.
  function verbPR(i) {
    return verbLink(i.pr_url, "PR",
      i.pr ? "the feed has no URL for PR #" + i.pr : "no PR on this issue yet");
  }
  function verbNudge(slug) {
    var label = "nudge " + slug;
    var attrs = actAttrs();
    var titleAttr = attrs ? "" : ' title="' + esc(label) + '"';
    return '<button data-act=\'' +
      esc(JSON.stringify({ action: "nudge", repo: slug })) + '\'' + attrs + titleAttr +
      ' aria-label="' + esc(label) + '"><span aria-hidden="true">▲</span></button>';
  }
  // The review items that say "fix before merge" for one issue (#117). ONE
  // home, read by the merge button's disabled test AND by the block that
  // renders them on the page -- a greyed button whose cause is only in a
  // title attribute is unreadable on a phone, and a listed finding whose
  // button is live is worse.
  //
  // The items live on the feed's `awaiting` array, one entry per REVIEW unit,
  // each carrying repo/slug/issue/pr plus `review`. `review` is
  // core.review_items_for_pr's shape: null when no review was found at all,
  // else {sha, items:[{n, verdict, location, finding}]} where items may be
  // EMPTY -- "a reviewer looked and found nothing", which is not the same as
  // "no review ran". Neither of those two blocks merge; only a present
  // fix-before-merge verdict does.
  function blockingFindings(d, slug, issue) {
    var row = (d && d.awaiting || []).filter(function (w) {
      return w.slug === slug && w.issue === issue;
    })[0];
    var items = row && row.review && row.review.items;
    if (!items || !items.length) return [];
    return items.filter(function (it) { return it.verdict === "fix-before-merge"; });
  }
  // The reason string, spelled once: it is both the button's hover text and
  // the heading over the findings themselves.
  var MERGE_BLOCKED = "a review finding says fix before merge — clear or overrule it first";
  function verbMerge(d, slug, i) {
    // Merge stays the operator's arm-then-confirm act. It is the one verb
    // the design keeps pointing at GitHub for (section 5 cuts one-tap merge
    // as a verb the tick may use), but the control the operator already has
    // is not removed by a redesign of the page around it -- a removed control
    // is indistinguishable from one that was never built (#66).
    //
    // The fix-before-merge gate is a HINT, not enforcement, exactly as it was
    // on the awaiting row this page replaced (#117 restores it after the
    // redesign dropped it). server.py's a_merge re-derives world state and
    // refuses anything that is not REVIEW on this issue's own PR, but it does
    // NOT consult the review block at all -- so nothing server-side stops a
    // merge over a blocking finding, and this greyed button is the only thing
    // between an operator and landing one. Deliberate: the operator can still
    // overrule a finding, but from GitHub, with the friction that decision
    // deserves. If a server-side gate ever lands, this stays as the cheap
    // local echo of it, not as the enforcement.
    var blocked = blockingFindings(d, slug, i.issue).length > 0;
    var label = "merge PR #" + i.pr;
    var attrs = actAttrsIf(i.pr == null || blocked,
        i.pr == null ? "no PR yet" : MERGE_BLOCKED);
    var titleAttr = attrs ? "" : ' title="' + esc(label) + '"';
    return '<button class="danger" data-merge=\'' +
      esc(JSON.stringify({ action: "merge", repo: slug, issue: i.issue, pr: i.pr })) +
      '\' data-confirm="merge PR #' + esc(i.pr) + '?"' +
      attrs + titleAttr + ' aria-label="' + esc(label) + '"><span aria-hidden="true">↳</span></button>';
  }
  function verbUnwatch(r) {
    // The transfer-box `untrack` is stage 2 (it writes state:"off" into
    // orch.json, which does not exist yet). `unwatch` is the action the
    // server accepts TODAY and does the same job against repos.txt, so the
    // TRACKED row keeps it under its real name rather than shipping a button
    // labelled with a verb nothing implements.
    var badPath = !SLUG_OK.test(String(r.path || "").replace(/~/g, ""));
    var label = "unwatch " + r.repo;
    var attrs = actAttrsIf(badPath, "this repo's path has characters the server will not accept — unwatch it from the command line instead");
    var titleAttr = attrs ? "" : ' title="' + esc(label) + '"';
    return '<button class="danger" data-unwatch=\'' +
      esc(JSON.stringify({ action: "unwatch", path: r.path })) +
      '\' data-confirm="unwatch ' + esc(r.repo) + '?"' +
      attrs + titleAttr + ' aria-label="' + esc(label) + '"><span aria-hidden="true">⊘</span></button>';
  }

  // ==== PAGE 4.1: the machine page ======================================
  // Order = the operator's jobs: anything for me -> my working set -> what I
  // could add -> the edge cases. The QUIET state is designed first, because
  // it is what the operator sees most: one furniture line, never an empty
  // titled block.
  function machinePage(d) {
    var t = d.tick || {};
    var tickAge = typeof t.minutes_since_last === "number" && t.minutes_since_last >= 0
      ? "tick " + mins(t.minutes_since_last) + " ago" : "tick never run";
    var out = '<div class="nav"><span class="t">orch</span>' +
      '<span class="m">' + esc(tickAge) + "</span>" + navRight() + "</div>";

    // The NEEDS YOU slice is CUT (issue #150): the machine page shows the
    // work itself now, nested under its repo, so a counter pointing at that
    // same work adds a layer without adding a fact. What survives here is
    // only the slug-less, machine-scope alerts -- see machineAlerts below.
    out += machineAlerts(d);

    // TRACKED is the PRIMARY section: the working set is the page's subject.
    // #259: feed.py ships r.state ("tracked" | "off") per repo, and a paused
    // ("off") repo belongs under AVAILABLE, not here. A MISSING state (any
    // feed predating this field, or a row that omits the key) must stay
    // TRACKED -- so the test is `=== "off"`, never a truthy/falsy check on
    // `state`, which would silently drop an undefined-state repo into
    // AVAILABLE.
    var allRepos = d.repos || [];
    var repos = allRepos.filter(function (r) { return r.state !== "off"; });
    var pausedRepos = allRepos.filter(function (r) { return r.state === "off"; });
    out += sectionHead("tracked", repos.length, "", "primary");
    if (!repos.length) {
      out += furniture("no repos tracked — watch one from the command line (`orch watch <path>`)", "hint");
    }
    repos.forEach(function (r) {
      // #160: the repo row is the fold control for its own nested issue
      // rows below it. foldId(), NOT idsafe() -- idsafe() is lossy (see its
      // own comment above) and a lossy id here means two repo rows sharing
      // one DOM id, not just a wrong map key, so the fold gets its own
      // injective builder. Default is EXPANDED (operator ruling on #160): a
      // repo is open unless `open` says otherwise, and `open` was seeded
      // from FOLD_KEY (what's folded) before this render, never from an
      // "is open" store.
      var fid = foldId(r.slug);
      out += repoRow(r, d, fid);
      out += '<div class="det' + (open[fid] === false ? "" : " on") + '" id="' + esc(fid) + '">' +
        repoIssueRows(r, d) + "</div>";
    });

    // AVAILABLE is SECONDARY: visible, because the transfer box needs both
    // lists on screen, but visually lighter. Its discovery list (new repos
    // nobody has watched yet) needs GET /repos.json, which is stage 2 -- but
    // #259 gives it real content today: a paused repo is already "available"
    // in the sense that operates here, so it renders as a genuine row via
    // repoRow(), same identity/path/verbs as a TRACKED row, `.det` fold
    // omitted (a paused repo carries issues: [], so there is nothing to
    // fold -- an empty `.det` would be a fold control for a block that is
    // always empty). The discovery hint only claims what is still unbuilt
    // (finding new repos), never "nothing to list" once paused rows exist.
    out += sectionHead("available", pausedRepos.length ? pausedRepos.length : null,
      "<button" + stageTwoAttrs("+ add path") + ">+ add path</button>" +
      "<button" + stageTwoAttrs("+ add URL") + ">+ add URL</button>");
    pausedRepos.forEach(function (r) {
      out += repoRow(r, d, null);
      // note (feed.py: "paused, CI broken" etc.) uses the same .note block
      // the merge-blocker findings use (#117) -- established prose treatment
      // for agent/operator-authored text, not a new shape.
      if (r.note) out += '<div class="note">' + esc(r.note) + "</div>";
    });
    out += furniture(pausedRepos.length
      ? "repo discovery lands in stage 2 (GET /repos.json) — finding new repos is not built yet"
      : "repo discovery lands in stage 2 (GET /repos.json) — nothing to list yet", "hint");

    // Other sessions: reference, collapsed behind its count, capped at 5.
    // unattached_total is the true pre-trim count (the bake step ships only
    // 5 entries); fall back to un.length so this still works against a raw,
    // untrimmed status.json (TUI / direct viewer).
    var un = d.unattached_sessions || [];
    var unTotal = (typeof d.unattached_total === "number") ? d.unattached_total : un.length;
    out += sectionHead("other sessions on this machine", unTotal, "", null, "dun");
    out += '<div class="det" id="dun">' + otherSessions(un, unTotal) + "</div>";

    out += machineFooter(d);
    return out;
  }

  // The machine-scope alert strip (issue #150). Slug-less alerts name no
  // repo -- tick stale (feed.py:719), dashboard-op-hung (feed.py:742),
  // deploy-behind (feed.py:751) -- so they cannot nest under a repo row and
  // render here instead, directly under the nav line that already carries
  // machine-scope facts. Slug-carrying alerts nest under their repo via
  // repoIssueRows and never reach this function.
  //
  // Deliberately NOT a general alerts strip: it holds only slug-less alerts,
  // at most 3, normally 0. Do not widen the filter below to admit alerts
  // that carry a slug -- those belong under their repo.
  function machineAlerts(d) {
    return needsYouRows(d, function (a) { return !a.slug; }).list.join("");
  }

  // A TRACKED row is an entity row: counts only, never health words. The
  // repoCounts() cell is four COUNTS in #386's vocabulary; aggregation is
  // counting, judgement is concluding, and this page never concludes. The needs-you count is CUT (#150): the
  // repo's alerts and issues now render as nested rows right below,
  // so a count here would be a second, redundant answer to the same
  // question repoIssueRows already shows in full.
  // `fid` (#160) is the id of the .det block holding this repo's nested
  // issue rows -- present only on the reachable path, since an unreachable
  // repo (below) renders no issues and so has nothing to fold.
  // orch#415: the repo row's own latest-act sub-line -- the live-row
  // feature's repo altitude (DASHBOARD-2026-09-17 §11.1). `orch.recent` is
  // acts only (heartbeat already filtered server-side, feed.py
  // repo_orch_json), newest last, so [-1] is the newest. 8 of 13 live repos
  // carry `recent: []` -- honest blank, same rule as the issue brief below,
  // never an empty sub-line. `at` is an offset ISO string ("...-04:00"), NOT
  // unix seconds, so mins_from_ts() (built for the latter) does not apply;
  // Date.parse() is the same approach tapeRows once sorted by (removed,
  // §11), reused here for age. An unparseable `at` renders the message
  // alone rather than a "NaN" age.
  function repoActSub(r) {
    var recent = (r.orch && r.orch.recent) || [];
    if (!recent.length) return "";
    var act = recent[recent.length - 1];
    var msg = clip(logMsg(act));
    if (!msg) return "";
    var ms = act.at ? Date.parse(act.at) : NaN;
    var ageStr = ms ? mins(Math.round((Date.now() - ms) / 60000)) + " ago" : "";
    return esc(msg) + (ageStr ? ' <span class="dim">· ' + esc(ageStr) + "</span>" : "");
  }

  function repoRow(r, d, fid) {
    if (!r.ok) {
      return entityRow({
        mark: '<span class="dot bad"></span>',
        id: esc(r.repo),
        what: '<span class="lvl-error">unreachable — the feed could not read this repo</span>'
      });
    }
    var issues = r.issues || [];
    var orch = r.orch || {};
    // The disclosure glyph (#160 review finding 4): cursor: pointer alone is
    // not a visible fold state, and an idle repo (no issues) looks identical
    // folded or open, so a click on it appears to do nothing. `open[fid] ===
    // false` is the same test the .det block below uses to decide its own
    // "on" class, so the glyph and the block it controls can never disagree.
    // Lives in er-mark alongside the live dot (not a new grid cell -- the
    // .er grid at ~line 104 has none to spare, and the 390px fold at ~line
    // 134 does not touch er-mark either way).
    // No fid means no .det block to fold (#259: an AVAILABLE/paused repo
    // carries issues: [], so nothing nests under it). The glyph and the
    // toggle class are BOTH gated on fid for the reason this comment gives
    // above: a row that shows a disclosure arrow and a pointer cursor but
    // has no data-t attracts a click that wire() never listens for, which
    // is the same "click appears to do nothing" failure in a new place.
    var foldMark = fid
      ? '<span class="fold-mark">' + (open[fid] === false ? "▸" : "▾") + "</span>"
      : "";
    // orch#301: stalled reuses .bad (same red as the !r.ok dot above) --
    // colour means "operator attention" either way, so one class covers
    // both. The wording is what has to stay distinguishable: !r.ok is the
    // feed failing to read the repo; this is a repo read fine that has
    // simply stopped moving. Title-only (hover), no new row/section/alert
    // (orch#150, orch#291).
    var stallWhy = r.stalled
      ? "stalled — open issues, no live orch, " +
        (r.stalled_since == null
          ? "nothing recorded yet"
          : "quiet for " + mins_from_ts(r.stalled_since))
      : "";
    // aria-label as well as title: the colour carries the signal for a
    // sighted operator and the title covers hover, but neither reaches a
    // screen reader -- same pairing the automerge dot uses.
    var stallMark = r.stalled
      ? '<span class="dot bad" title="' + esc(stallWhy) +
        '" aria-label="' + esc(stallWhy) + '"></span>'
      : "";
    return entityRow({
      // toggle: cursor affordance, same class sectionHead's disclosure rows
      // use (#160). The [data-t] handler (wire()) already ignores clicks
      // whose target is an A or BUTTON, so the nested "repo ›" link and the
      // verb buttons below keep working -- see also the anchor's own
      // stopPropagation, belt-and-suspenders for the same reason (#160).
      cls: fid ? "repo toggle" : "repo",
      attrs: fid ? ' data-t="' + esc(fid) + '"' : "",
      mark: foldMark + dot(orch.alive, orch.alive ? " pulse" : "") + stallMark,
      id: '<a href="' + esc(href(r.slug)) + '" onclick="event.stopPropagation()">' + esc(r.repo) + " ›</a>",
      what: esc(repoCounts(r)) +
            ' <span class="k2">' + esc(r.path || "") + "</span>" +
            // orch#284: per-issue automerge is the dot on each row below.
            // The repo DEFAULT is now readable (feed's `auto_land` on the
            // repo object), so it is rendered for real -- but disabled,
            // because nothing in orch writes orch.json's auto-land key yet;
            // that write path is orch#230's ground, not this one. Named with the true
            // blocker (a config writer, not "not built") so the operator
            // does not think the display itself is missing.
            ' <span class="m disabled" title="automerge ' + (r.auto_land ? "on" : "off") +
              ' (repo default) — read-only: changing it needs a config writer (orch#230)">repo default: automerge ' +
              (r.auto_land ? "on" : "off") + "</span>",
      age: "",
      verbs: verbNudge(r.slug) + verbUnwatch(r),
      sub: repoActSub(r)
    });
  }

  // The rows nested under a repo (issue #150): first that repo's own alerts
  // (loud, same shape as before), then each of its
  // issues at a second indent. This is where the cut NEEDS YOU count's
  // detail moved to -- the repo row above states the counts (repoCounts),
  // this renders the rows behind them.
  //
  // THE PREDICATE IS `issue == null`, and that is the whole of #166.
  //
  // This function used to render every slug-carrying alert as its own row,
  // then every issue. feed.py gives SIX kinds both a slug and an `issue`
  // (contended, wedged, waiting-on-merge, abandoned, died-before-starting,
  // still-running-after-pr), so an issue carrying two of them became THREE
  // rows: one per alert, plus its own. Measured on the live feed, orch#132
  // did exactly that.
  //
  // The operator's ruling: "Alerts are not objects. The page renders repos
  // and issues, nothing else." An alert naming an issue is a FACT ABOUT that
  // issue, not a sibling of it -- and it is a fact the issue row already
  // carries, because feed.py derives both from the same fields pillState
  // reads. Rendering it twice is the pillState failure (see the comment at
  // the top of this file) promoted to a row: one screen, two shapes for one
  // fact, free to disagree.
  //
  // So an alert WITH an `issue` renders no row at all. Its issue's row is the
  // one row, and #163's automerge toggle hangs on exactly one of them.
  //
  // An alert with a slug but NO `issue` names no issue, so it duplicates
  // nothing and stays -- dropping it would take the operator's only route to
  // the note with it (#93, #66). It keeps
  // `cls: "loud"`, which is what tells it apart from an issue row.
  //
  // RENDERING ONLY. feed.py is untouched: tick.py:130-135 counts `error`
  // alerts into the wake gate, so removing them from the feed would silently
  // change when orch wakes.
  function repoIssueRows(r, d) {
    if (!r.ok) return "";
    var out = needsYouRows(d, function (a) {
      return !!a.slug && a.slug === r.slug && a.issue == null;
    }, true).list.join("");
    (r.issues || []).forEach(function (i) {
      var st = pillState(i);
      out += entityRow({
        cls: "nest",
        mark: autoDot(i, r.slug),
        id: issueLink(r.slug, i),
        what: pill(st) + " " + esc(i.title || "(untitled)"),
        age: mins_from_ts(i.activity),
        verbs: verbPR(i),
        // orch#415 (DASHBOARD-2026-09-17 §11.1): the machine page is the
        // page an operator watches, and it rendered no brief at all until
        // this -- the repo page had the only copy. briefSub() is the same
        // helper the repo page uses, so the two can never disagree.
        sub: briefSub(i)
      });
    });
    return out;
  }

  // The unattached-transcript scan: still the answer to "where work goes
  // missing". Capped at 5 shown, the rest behind a "+N more" count.
  function otherSessions(un, total) {
    if (typeof total !== "number") total = un.length;
    if (!un.length) return furniture("no unattached sessions", "hint");
    var body = un.slice(0, 5).map(function (u) {
      return entityRow({
        cls: "lite",
        id: '<span class="k2">' + esc(u.path || u.project || "?") + "</span>",
        what: esc(u.id || ""),
        age: mins(u.idle_min)
      });
    }).join("");
    if (total > 5) body += furniture("+" + (total - 5) + " more", "hint");
    return body;
  }

  // The footer: [tick now], the dashboard-op dot, disk %. The ledger section
  // is CUT (section 7) -- it duplicated liveness the pages already show --
  // and dashboard-op survives as exactly this dot. Host `load` is cut; disk
  // stays.
  function machineFooter(d) {
    var h = d.host || {}, dop = d.dashboard_op || null;
    var tickAttrs = actAttrs();
    return '<div class="foot">' +
      '<button data-act=\'' + esc(JSON.stringify({ action: "tick" })) + '\'' +
      tickAttrs +
      tipAttrs("run one orch tick immediately, instead of waiting for the scheduled one", !tickAttrs) +
      ">tick now</button>" +
      '<span class="right">' +
      '<span title="' + esc(dop ? "dashboard-op " + (dop.alive ? "alive" : "idle") +
        " · " + (dop.prior_runs || 0) + " prior runs" : "no dashboard-op on record") + '">' +
      dot(dop && dop.alive) + " dop</span>" +
      '<span>disk ' + esc(h.disk || "—") + "</span></span></div>";
  }

  // ---- NEEDS YOU rows (section 4.1's taxonomy) -------------------------
  // Rows are computed FEED-side: the alerts array now carries structured
  // fields (kind/slug/repo/issue/what/age_min/verb, plus pr/pr_url where
  // relevant) so this renders a ROW instead of re-parsing an English
  // sentence back into fields. Rows WITHOUT a `kind` -- the machine-level
  // alerts (tick stale, oracle) -- have no structure to render,
  // so they fall back to `msg` verbatim rather than being dropped.
  //
  // THE needs-you predicate, with exactly one home (#117) -- and that home is
  // the FEED, not this file. `a.needs_you` is set by feed.py's alerts builder
  // for every row in 4.1's taxonomy; this reads the flag and derives nothing.
  //
  // What was here before was `a.level === "error" || a.level === "warn"`, and
  // it was wrong twice over. It dropped "wedged" and "waiting on merge" --
  // both deliberately `info`, because `level` decides what the wake digest
  // folds in and neither should wake anyone -- so the ordinary "your PR is
  // green and waiting for you to merge" case, one of the two rows in 4.1's
  // own artboard, rendered as "✓ nothing needs you". And it kept alerts that
  // name no unit of work at all ("gh read failed") purely for being `error`.
  // Membership in NEEDS YOU and severity are two different axes; see the long
  // comment on feed.py's alerts builder for why they must stay two.
  //
  // It was also a SECOND home for the rule: repoRow counted a repo's
  // needs-you rows with no level filter at all, ten lines from a list that
  // filtered to error+warn, so one screen carried two answers for one repo.
  // That is exactly the failure pillState records above. Both call sites now
  // go through here.
  function isNeedsYou(a) {
    return !!(a && a.needs_you);
  }
  // `extra`, added for #150's split (machine strip vs. per-repo nesting),
  // narrows WHICH needs-you alerts this call renders -- machineAlerts passes
  // "no slug", repoIssueRows passes "this repo's alerts".
  // `nested` indents the rows one level -- true for a repo's own alerts,
  // false for the machine-scope strip. See needsYouRow.
  function needsYouRows(d, extra, nested) {
    var alerts = d.alerts || [];
    var mine = alerts.filter(isNeedsYou);
    if (extra) mine = mine.filter(extra);
    return { list: mine.map(function (a) { return needsYouRow(a, nested); }) };
  }

  // One needs-you row. An anomaly is a ROW whose status cell is loud -- the
  // card taxonomy survives intact as row vocabulary, the bespoke card layout
  // died into the entity-row shape (section 2/3.1).
  //
  // `nested` (#150) adds the same one-level inset the nested issue rows use.
  // A repo's alerts sit WITH that repo's issues, so they take the indent;
  // the machine-scope strip sits under the header at indent 0 and does not.
  // Same row shape either way -- only the inset differs, so 3.1's fold rule
  // still applies unchanged.
  function needsYouRow(a, nested) {
    var extraCls = nested ? " nest" : "";
    var lvl = a.level === "error" ? "lvl-error" : a.level === "warn" ? "lvl-warn" : "lvl-info";
    var mark = '<span class="' + lvl + '">●</span>';
    // No `kind`: a machine-level alert (tick stale, oracle). Names no issue
    // in structured form, so the row IS its msg.
    if (!a.kind) {
      var collapsed = a.msg || "";
      // #166: nested, this row sits inside a section already headed with the
      // repo name, so repeating it is the "lists the repo twice" the operator
      // reported. Unnested (machineAlerts) the repo name is the only thing
      // identifying it, so it stays.
      return entityRow({
        cls: "loud" + extraCls, mark: mark,
        id: !a.slug ? ""
          : '<a href="' + esc(href(a.slug)) + '">' + esc(a.slug) + "</a>",
        what: esc(collapsed),
        age: a.at ? clock(a.at) : "",
        verbs: ""
      });
    }
    var kindText = {
      "contended": "contended",
      "wedged": "wedged",
      "waiting-on-merge": "waiting on merge",
      "abandoned": "abandoned",
      "died-before-starting": "died before starting",
      "still-running-after-pr": "still running after PR"
    }[a.kind] || a.kind;
    // The what-line: the condition, then the taxonomy's what-line text.
    // `what` may legitimately be empty -- the abandoned row's what-line is
    // "—" in the taxonomy because the journal holds the why -- so an empty
    // string renders as the condition alone, never as a filler sentence.
    var what = '<span class="' + lvl + '">' + esc(kindText) + "</span>" +
               (a.what ? " · " + esc(a.what) : "");
    // #166: nested rows drop the repo prefix -- `#132`, not `orch #132`, since
    // the section header above already carries the repo name. As of #166 an
    // alert carrying an `issue` renders no nested row at all (repoIssueRows
    // filters it out, because its issue's own row is the one row), so this
    // branch is reached unnested today. The nested form is kept correct
    // anyway: a future caller passing `nested` must not reintroduce the
    // doubled repo name this issue removed.
    return entityRow({
      cls: "loud" + extraCls, mark: mark,
      id: (a.slug && a.issue != null
        ? '<a href="' + esc(href(a.slug, a.issue)) + '">' +
          (nested ? "" : esc(a.slug) + " ") + "#" + esc(a.issue) + "</a>"
        : esc(a.repo || a.slug || "")),
      what: what,
      age: mins(a.age_min),
      verbs: needsYouVerb(a)
    });
  }

  // The taxonomy's verbs column, mapped onto real controls. `verb` is what
  // feed.py set; anything unrecognised gets the issue link, which is the one
  // target that always exists.
  function needsYouVerb(a) {
    if (a.verb === "pr") return verbPR(a);
    // `log` and `tail` both have nowhere to render here. `tail` has no file
    // to name: the taxonomy's "still running after PR" row points at a
    // session, and the alert carries no file path. `log` knows its issue,
    // but the RUN LOG section and the element it paints into live on the
    // issue page, and an alert row has no sink -- a button here would post
    // and then discard what came back. Both link to the issue instead,
    // where the real controls are.
    if (a.verb === "log" || a.verb === "tail") return verbLink(a.url, "issue", "this alert carries no issue URL");
    return verbLink(a.url, "issue", "this alert carries no issue URL");
  }

  // ==== PAGE 4.2: the repo page =========================================
  // Order: WHAT MOVED -> ACTIVE -> INACTIVE -> JOURNAL. Live work first,
  // then membership, then history. ACTIVE is primary.
  function repoPage(d, slug) {
    var r = (d.repos || []).filter(function (x) { return x.slug === slug; })[0];
    var out = '<div class="nav"><a href="#/">‹ orch</a>' +
      '<span class="t">' + esc(r ? r.repo : slug) + "</span>";
    // orch#116: emitted for any repo the feed knows, INCLUDING !r.ok --
    // "which checkout is this?" is most worth answering precisely when the
    // repo is unreachable and a stale or moved path is the likely cause.
    if (r && r.path) {
      out += '<span class="rpath" title="checkout path on this machine">' +
             esc(r.path) + "</span>";
    }
    if (r && r.ok) {
      out += '<span class="m">' + esc(repoCounts(r)) + "</span>" +
             // orch#284: per-issue automerge lives on each row's dot below;
             // the repo default is now shown for real (see repoRow's comment
             // at :1349 for why it is disabled).
             '<span class="m disabled" title="automerge ' + (r.auto_land ? "on" : "off") +
               ' (repo default) — read-only: changing it needs a config writer (orch#230)">repo default: automerge ' +
               (r.auto_land ? "on" : "off") + "</span>";
    }
    out += navRight(r ? verbNudge(r.slug) : "") + "</div>";
    if (!r) {
      return out + furniture("no repo named " + esc(slug) + " in this feed — it may have been unwatched", "hint");
    }
    if (!r.ok) {
      return out + furniture("this repo is unreachable — the feed could not read it", "cond");
    }

    // WHAT MOVED is furniture at rest: a header, a [generate] button, and the
    // cached table only if one exists. It NEVER renders as an empty block.
    // Generation is the one deliberate model call in the design and lands in
    // stage 2, so the button is emitted disabled with that reason.
    out += sectionHead("what moved", null,
      "<button" + stageTwoAttrs("generate a WHAT MOVED digest") + ">generate</button>");
    out += furniture("no digest generated — the summary verb lands in stage 2", "hint");

    // ACTIVE: primary. Quiet state -> the furniture line, never an empty
    // titled block, and INACTIVE effectively becomes the primary section
    // because membership is then the job the visit is for.
    var issues = r.issues || [];
    out += sectionHead("active", issues.length, "", "primary");
    if (!issues.length) {
      out += furniture("nothing active — activate an issue below", "hint");
    }
    issues.forEach(function (i) {
      var st = pillState(i);
      // orch#289 (part 3): display_name is a short name shown ALONGSIDE the
      // full title, never instead of it -- the operator explicitly rejected
      // replacing the title. Empty/absent display_name renders exactly what
      // rendered before this unit (title alone), no invented fallback.
      var titleHtml = esc(i.title || "(untitled)");
      var nameHtml = i.display_name ?
        "<b" +
          (i.name_stale ? ' title="stored title drifted from the live title"' : "") +
          ">" + esc(i.display_name) + "</b> " +
          '<span class="dim">' + titleHtml + "</span>" :
        titleHtml;
      // Part 4: the journal-tail sub-line, via the shared briefSub() helper
      // (orch#415) so this and the machine page's repoIssueRows render one
      // brief identically -- see briefSub's own comment.
      out += entityRow({
        mark: autoDot(i, slug),
        id: issueLink(slug, i) + " ›",
        what: pill(st) + " " + nameHtml,
        age: mins_from_ts(i.activity),
        // orch#358: the operator's verb set here is PR only -- kill left the
        // dashboard for the terminal (`spawn.py kill`).
        verbs: verbPR(i),
        sub: briefSub(i)
      });
    });

    // INACTIVE: orch#284. There is no /issues.json endpoint and this does
    // NOT fetch one -- `unconsidered` is a REPO-LEVEL fact the feed already
    // ships (feed.py repo_json): open issue NUMBERS that are neither
    // claimed nor covered, i.e. exactly "not being worked", which is what
    // this section means by inactive. It is numbers only, no title/state,
    // so the row renders honestly with just the number -- no invented text.
    // The stage-2 buttons stay disabled: adding/loading MORE issues than the
    // feed already names is still a write path nothing serves yet.
    var unconsidered = r.unconsidered || [];
    out += sectionHead("inactive", unconsidered.length,
      "<button" + stageTwoAttrs("+ add issue") + ">+ add issue</button>" +
      "<button" + stageTwoAttrs("load all open issues") + ">load all open issues</button>");
    if (!unconsidered.length) {
      out += furniture("nothing inactive — every open issue is already being considered", "hint");
    }
    unconsidered.forEach(function (n) {
      out += entityRow({
        id: '<a href="' + esc(href(slug, n)) + '">#' + esc(n) + "</a>",
        what: ""
      });
    });

    // JOURNAL: the event log, rendered for the first time. `orch.recent` has
    // shipped in the feed since before this page existed and was rendered
    // nowhere. Reference at rest -- the last few entries -- expanding when
    // the operator is tracing, which is exactly when they ask for more.
    var recent = (r.orch || {}).recent || [];
    out += sectionHead("journal", recent.length,
      "<button" + stageTwoAttrs("load earlier journal entries") + ">load earlier</button>");
    out += journalBody(recent);
    // The note box: `ask` as a plain journal append (section 5) -- typing
    // here is not a launch, just an attributed line for the repo-orch to
    // read on its next wake. Rides the generic [data-reply] handler in wire()
    // with zero new JS: the payload just names its own `action`. It is now
    // that handler's only emitter -- #291 removed the QUESTIONS section and
    // with it `replyBox`, which is what the handler originally shipped for --
    // so the handler stays for this box's sake. One box per rendered repo
    // page, so a fixed id is safe: there is only ever one #note-input in the
    // DOM at a time for getElementById to find.
    var notePayload = { action: "ask", repo: slug, input: "note-input" };
    var noteAttrs = actAttrs();
    out += furniture('<input type="text" id="note-input" placeholder="leave note…"' +
      noteAttrs + '><button data-reply=\'' + esc(JSON.stringify(notePayload)) +
      '\'' + noteAttrs +
      tipAttrs("append the typed text to this repo's journal, read on its next wake", !noteAttrs) +
      ">send</button>");
    out += furniture("the note is read on the next wake; [nudge] above wakes one now", "hint");
    return out;
  }

  // The journal, as log rows with SYNTHETIC GAP ROWS between them. The gaps
  // are derived HERE, at render time, from the delta between consecutive
  // entries -- nothing stores them. This is what makes downtime and idleness
  // distinguishable, the one thing git could not show.
  function journalBody(rows) {
    if (!rows.length) {
      return furniture("no journal entries — this repo's orch has not written one yet", "hint");
    }
    // A gap shorter than this is just the normal tick cadence and marking it
    // would bury the real gaps in noise. Derived from the feed's own idle
    // threshold rather than a second hardcoded number (section 7 cuts the
    // hardcoded 25): a gap only counts as one once it exceeds the interval
    // the system itself calls idle. No threshold in the feed -> no gap rows,
    // rather than a guess.
    var floor = typeof NUDGE_IDLE_MINS === "number" && NUDGE_IDLE_MINS > 0
      ? NUDGE_IDLE_MINS * 60 : null;
    var out = "", prev = null;
    rows.forEach(function (row) {
      var at = row && row.at ? Date.parse(row.at) : NaN;
      var t = isNaN(at) ? null : at / 1000;
      if (floor !== null && prev !== null && t !== null && t - prev >= floor) {
        out += gapRow(t - prev);
      }
      if (t !== null) prev = t;
      out += logRow(clock(row && row.at), (row && row.actor) || "?", logMsg(row));
    });
    return out;
  }

  // The run log's body: a_log's `runs` array (orch#151), newest run first,
  // rows chronological within a run -- see server.py:a_log. RUN BOUNDARIES
  // MUST STAY VISIBLE ("all runs of this key" is the whole point, not one
  // flat stream), so each run opens with a gapRow-shaped banner carrying its
  // start time + pgid, reusing 3.2's own divider shape rather than inventing
  // a second one. Rows reuse logRow: kind is the actor column (it names WHO
  // /WHAT acted, same role journalBody gives `actor`), body is the message.
  // A non-null status (ok/ERR -- the tool-result signal) is appended as a
  // bracketed suffix on the message, since .lg has no fourth cell to spend
  // on it and a bolted-on column would break the fold media query 3.2 owns.
  // logRow() escapes its whole `msg` argument as plain text, so it cannot
  // carry the status span's markup -- build that one row by hand instead,
  // still escaping every interpolated field with esc(). ERR gets the file's
  // existing bad-state red (#ff7b72, the .BLOCKED/.ABANDONED colour); ok
  // gets the existing good-state green (#3fb950, the .dot.ok colour) --
  // both ad-hoc inline styles, matching this file's one other such marker
  // (runLogBody has no third severity to invent a palette for).
  function runLogBody(runs) {
    if (!runs || !runs.length) {
      return furniture("no run log on record for this issue", "hint");
    }
    var out = "";
    runs.forEach(function (run) {
      var started = run && run.started ? clock(run.started) : "?";
      var pgid = run && run.pgid ? "pgid=" + run.pgid : "pgid ?";
      // Not gapRow(): that formats its argument through span(), a duration
      // helper, so a run banner would render as "NaNm gap" and lose the
      // start time and pgid entirely. This divider is what makes "all runs
      // of this key" legible as several runs rather than one flat stream.
      out += '<div class="lg-gap">—— run ' + esc(started) + " · " + esc(pgid) +
        (run && run.caveman ? " · caveman" : "") + " ——</div>";
      (run && run.rows || []).forEach(function (row) {
        var time = (row && row.time) || "?";
        var kind = (row && row.kind) || "?";
        var body = String((row && row.body) || "");
        var status = row && row.status;
        if (!status) { out += logRow(time, kind, body); return; }
        var bad = status === "ERR";
        out += '<div class="lg"><span class="lg-time">' + esc(time) + "</span>" +
          '<span class="lg-actor">' + esc(kind) + "</span>" +
          '<span class="lg-msg">' + esc(body) +
          ' <span style="color:' + (bad ? "#ff7b72" : "#3fb950") + '">[' + esc(status) + "]</span></span></div>";
      });
    });
    return out;
  }

  // ==== PAGE 4.3: the issue page ========================================
  // A DETAIL page, not a list. Six blocks: title, condition line, STATE as
  // a definition list, ACTIONS, SESSIONS, RUN LOG.
  function issuePage(d, slug, num) {
    var r = (d.repos || []).filter(function (x) { return x.slug === slug; })[0];
    var i = r && (r.issues || []).filter(function (x) { return x.issue === num; })[0];
    var out = '<div class="nav"><a href="' + esc(href(slug)) + '">‹ ' + esc(slug) + "</a>" +
      '<span class="t">#' + esc(num) + "</span>";
    if (i) {
      out += '<span class="t" style="font-weight:500">' + esc(i.title || "(untitled)") + "</span>" +
        // orch#284: the design artboard puts the automerge toggle in the
        // header next to the title, not only in the STATE deflist below.
        // Reuse autoDot -- same control, same payload -- so the header copy
        // and the deflist copy can never drift into two different toggles.
        autoDot(i, slug) +
        // 1. TITLE BLOCK -- identity + state pills: "what is this".
        // Both axes, because they are two resolutions of one fact and the
        // page is where an operator reads the whole fact. The compact row
        // pill resolves via pillState(); this page deliberately does not,
        // because a detail page that showed the list's resolution would add
        // nothing to the list it drilled in from.
        //
        // Each pill is LABELLED with the axis it answers. The two axes are
        // independent by construction -- issue_state reads labels alone,
        // work_state reads the branch and PR alone (core.py) -- so they can
        // legitimately disagree, and a stale branch alone is enough: an
        // unclaimed issue with a leftover issue-<n> branch sits at
        // state=UNCLAIMED work_state=CLAIMED indefinitely (observed on
        // ops-console#42, no session, no claim pending). Printed bare as
        // "UNCLAIMED · CLAIMED" that reads as one answer contradicting
        // itself; labelled, it reads as the two different questions it is.
        // The TUI renders the same pair labelled for the same reason
        // (tui_model.py _issue_facts).
        '<span class="m">issue ' + pill(i.state) + " · work " + pill(i.work_state) + "</span>";
    }
    out += navRight() + "</div>";
    if (!i) {
      return out + furniture("issue #" + esc(num) + " is not in this feed — it may have landed, " +
        "or the repo may no longer be watched", "hint");
    }

    // 2. CONDITION LINE -- furniture, exceptional state ONLY. The same
    // needs-you vocabulary as the machine page, one loud line under the
    // title. Absent when nothing is wrong: the common state has no banner.
    (d.alerts || []).forEach(function (a) {
      if (a.slug !== slug || a.issue !== num) return;
      out += furniture(esc(a.msg || a.kind || ""), "cond");
    });

    // 3. STATE -- a definition list (3.3) at primary weight. A definition
    // list, NOT rows: rendering label->value pairs as entity rows made "a
    // form pretending to be a table".
    out += sectionHead("state", null, "", "primary");
    var pairs = [
      ["branch", esc(i.branch || "—") + " · " + commits(i.commits) + " commits · idle " + mins(i.idle_min)],
      ["PR", (i.pr == null ? "none"
        // orch#68: gate on the URL, not the number -- a null pr_url with a
        // truthy pr previously rendered an anchor with an empty href, which
        // reloaded the page instead of navigating when clicked.
        : i.pr_url ? '<a href="' + esc(i.pr_url) + '" target="_blank" rel="noopener">#' + esc(i.pr) + " ↗</a>"
        : '<span class="disabled">#' + esc(i.pr) + " (no URL in the feed)</span>")],
      ["labels", esc((i.labels || []).join(", ") || "—")],
      // orch#163: this axis is now BUILT (the repo-level default in
      // sectionHead/repo-row comments elsewhere is the one still not
      // built). Read i.auto_land alone -- never i.labels -- and reuse the
      // exact same dot+data-act control the list rows use (autoDot),
      // so there is one home for "what does tapping this do", not a
      // second toggle with its own payload that could drift from the
      // first.
      ["automerge", autoDot(i, slug) + " " + (i.auto_land ? "on" : "off")],
      ["issue-orch", dot(i.orch_alive) + (i.orch_alive ? " alive" : " dead") +
        " · " + (i.prior_runs || 0) + " prior runs" +
        (i.contended ? ' <span class="s BLOCKED">contended</span>' : "")]
    ];
    if (i.brief && i.brief.text) {
      // The issue-orch's own qualitative line, read from its journal by the
      // tick. The page RENDERS it and computes nothing: a brief assembled
      // here would be a second derivation that can disagree with the feed's.
      // Absent brief renders nothing at all -- an issue whose first wake has
      // not finished gets an honest blank, never an invented sentence.
      pairs.push(["brief", esc(i.brief.text) +
        (i.brief.stale ? ' <span class="s CHECKING">stale</span>' : "")]);
    }
    out += defList(pairs);

    // 4. ACTIONS -- the verbs grouped in ONE place, secondary, plus the
    // resume command as a furniture code line. Verb output renders INLINE
    // here (the global #out pre is cut, section 7).
    var sink = idsafe(slug) + num;
    out += sectionHead("actions", null, "", "primary");
    // The blocking findings, ABOVE the verbs they disable (#117). A greyed
    // merge button whose only explanation is a title attribute is no
    // explanation at all -- titles do not exist on touch, which is the
    // design's primary target (section 3). Rendered from the same
    // blockingFindings() the button's disabled test reads, so the list and
    // the greying can never disagree. Absent when nothing blocks: the common
    // state gets no banner, same rule as the condition line above.
    var blockers = blockingFindings(d, slug, i.issue);
    if (blockers.length) {
      out += furniture(esc(MERGE_BLOCKED), "cond");
      out += '<div class="note">' + blockers.map(function (it) {
        return esc(String(it.n) + ". " + (it.location || "?") + " — " + (it.finding || ""));
      }).join("\n") + "</div>";
    }
    out += '<div class="verbs" style="flex-wrap:wrap">' +
      verbMerge(d, slug, i) +
      verbLink(i.url, "issue", "this issue has no URL in the feed") + "</div>";
    // The resume line, for a local operator who will not wait for the tick's
    // own recovery. Terminal friction is RIGHT for overriding the system's
    // launcher (section 4.1): dead rows deliberately carry no start button.
    var resume = (i.sessions || []).filter(function (s) { return s.resume; })[0];
    out += furniture(resume
      ? "resume by hand: " + esc(resume.resume)
      : "resume by hand: no session on record to resume", "code");
    out += '<pre class="out" id="o' + esc(sink) + '"></pre>';

    // 5. SESSIONS -- entity rows with tail. A run log is what the process
    // did; a transcript is what it said. DESIGN names them as different
    // questions -- tail is per-session (s.file), so it stays in this loop;
    // log is "all runs of this key" (issue-scoped, not session-scoped), so
    // it moved to its own RUN LOG section below (block 6) rather than
    // repeating an identical repo/issue request once per session row.
    var sessions = i.sessions || [];
    out += sectionHead("sessions", sessions.length, "", "primary");
    if (!sessions.length) out += furniture("no sessions on record for this issue", "hint");
    sessions.forEach(function (s) {
      out += entityRow({
        mark: dot(s.live, s.live ? " pulse" : ""),
        id: '<span class="k2">' + esc(s.id) + "</span>",
        what: esc(s.turns + " turns · idle " + secs(s.idle_sec) + (s.current ? " · current" : "")),
        age: "",
        verbs: verbTail(s.file, sink, s.id)
      });
      // An empty worker list and a walk that RAISED must not render the same.
      // Silence here reads as "this session spawned nothing", and an operator
      // acts on that -- it is the input to the long-running-lease kill. So
      // say so, not silence (#66). See STATES.md finding 10: enforcing the
      // unknown at the derivation is only half the fix if no consumer
      // renders it.
      var ws = s.workers || [];
      if (s.workers_unreadable) {
        out += '<div class="wks">workers unreadable</div>';
      } else if (ws.length) {
        out += '<div class="wks">' + ws.map(function (w) {
          return esc(w.id) + " · " + (w.turns || 0) + " turns · idle " + esc(secs(w.idle_sec));
        }).join("<br>") + "</div>";
      }
    });

    // 6. RUN LOG -- all runs of this key, not one run (orch#151). SESSIONS
    // above is scoped to one run at a time ("1 of 3 runs" in the artboard);
    // this is the whole key's history across every run that ever held it.
    // A run log is what the process DID; SESSIONS/tail is what it SAID --
    // the subtitle below is the one line that keeps those legible as
    // different questions, per the artboard's own wording.
    //
    // On-demand, not feed data (docs/UX-REDESIGN.md section 8 classes `log`
    // as a stage-2 server action): nothing renders here until the button in
    // the header is clicked, same round-trip shape as tail.
    out += sectionHead("run log", null,
      '<span class="m">all runs of this key</span>' + verbLog(slug, i.issue, sink), "primary");
    out += '<div id="rl' + esc(sink) + '"></div>';

    // The steering footer: the journal is a LABELED STEERING LINK, not an
    // embed and not a verb. It is GitHub comments (D2); human replies pass
    // into the next brief unfiltered as steering input (core.journal_tail),
    // and the phone writes GitHub threads natively. A second write path
    // through /act would duplicate a better surface.
    out += furniture(i.url
      ? 'steer this issue: <a href="' + esc(i.url) + '" target="_blank" rel="noopener">comment on the thread ↗</a>'
      : "steer this issue: no thread URL in the feed", "hint");
    return out;
  }

  function render(d) {
    // Remembered so the /act probe can repaint off-origin, where poll() is a
    // no-op and there is no second source of data to re-render from (#66).
    last_data = d;
    armed = null;
    generated_at = d.generated || null;
    // The threshold the tick actually uses, not a client-side copy of it.
    NUDGE_IDLE_MINS = typeof d.nudge_idle_mins === "number" ? d.nudge_idle_mins : null;

    var rt = route();
    var out = rt.page === "repo" ? repoPage(d, rt.slug)
            : rt.page === "issue" ? issuePage(d, rt.slug, rt.issue)
            : machinePage(d);
    // Unconditional, always. The gate that once shipped was not spelled
    // CAN_ACT at all: render() built every control into `out` and then threw
    // the whole string away when a state test said the queue was empty --
    // which removed the only controls that could recover the page. An
    // empty-state NOTE is fine and wanted; it is APPENDED inside the page
    // builders above, never substituted for the page (#66).
    $("body").innerHTML = out;

    // The visible readout of why the controls are dead. ACT_REASON names the
    // actual failure when the probe recorded one; the older origin-flavoured
    // wording stays as the fallback for when it has not spoken yet (#66).
    // When the page is not same-origin, FEED_REASON names BOTH origins: the
    // old wording here ("rebuilt each tick") described a healthy sandbox and
    // read as reassurance on a page whose feed address was simply wrong (#82).
    $("ro").textContent = CAN_ACT
      ? ""
      : (ACT_REASON ? ACT_REASON
                    : (SAME_ORIGIN ? "no /act endpoint — viewer only"
                                   : FEED_REASON));
    paintAge();
    wire();
  }

  // Relative age plus the absolute moment the data describes, so a page left
  // open cannot keep claiming "just now". Reads the stored stamp only.
  function paintAge() {
    var el = $("age");
    if (!el) return;
    var gen = generated_at ? new Date(generated_at) : null;
    if (!gen || isNaN(gen)) { el.textContent = ""; return; }
    var s = Math.max(0, Math.round((Date.now() - gen.getTime()) / 1000));
    el.textContent = (s < 5 ? "just now" : secs(s) + " ago") + " · " + clock(generated_at);
  }

  function wire() {
    document.querySelectorAll("[data-t]").forEach(function (el) {
      el.onclick = function (e) {
        if (e.target.tagName === "A" || e.target.tagName === "BUTTON") return;
        var id = el.getAttribute("data-t"), dd = $(id);
        if (dd) {
          // Flip off the DOM's OWN current class, not open[id]'s truthiness:
          // "dun" (other sessions) defaults CLOSED (open[id] undefined =
          // falsy = closed), but a repo fold id (#160) defaults OPEN
          // (open[id] undefined = expanded, per the FOLD_KEY seed above) --
          // two different meanings for "undefined" on the same shared map.
          // The rendered className is the one ground truth both agree on.
          var nowOpen = dd.className.indexOf(" on") === -1;
          open[id] = nowOpen;
          dd.className = "det" + (nowOpen ? " on" : "");
          // Persist ONLY repo fold ids (foldId()'s "rp-" prefix, #160). The
          // delimiting hyphen matters: a bare "rp" prefix would also match
          // some future unrelated toggle id like "rpt" or "rpanel" and
          // silently persist it into the repo-fold store, so the test below
          // checks for the full "rp-" prefix, not just "rp". "other
          // sessions" (id "dun") stays unpersisted -- it is reference, and
          // its current behaviour (resets to collapsed on reload) must not
          // change. The store records what is FOLDED (see FOLD_KEY above),
          // so an open repo is a deleted key, not a `false` value -- keeping
          // the store's only content the exceptions to the expanded default.
          if (id.indexOf("rp-") === 0) {
            var folded = foldedSet();
            if (nowOpen) { delete folded[id]; } else { folded[id] = true; }
            foldSave(folded);
          }
        }
      };
    });
    document.querySelectorAll("[data-act]").forEach(function (b) {
      // A [data-act] button that also carries data-confirm arms on the first
      // click and fires on the second, exactly like [data-unwatch]/[data-merge].
      // Without the attribute it stays the plain one-click path it always was.
      var sink = b.getAttribute("data-sink") || null;
      if (b.hasAttribute("data-confirm")) {
        b.onclick = function (e) {
          e.stopPropagation();
          if (armed === b) {
            disarm();
            try { act(JSON.parse(b.getAttribute("data-act")), b, sink); } catch (err) {}
            return;
          }
          disarm();
          armed = b;
          b.className = "danger armed";
          btnSay(b, b.getAttribute("data-confirm"));
        };
        return;
      }
      // data-no-btn (autoDot, orch#163): this control has no text to
      // replace -- pass null so act() skips the textContent writes it
      // otherwise makes on btn ("…", then "done"/"failed", or "?" on a
      // failed fetch), which would spill out of the dot's 7px box.
      var actBtn = b.hasAttribute("data-no-btn") ? null : b;
      b.onclick = function (e) {
        e.stopPropagation();
        try { act(JSON.parse(b.getAttribute("data-act")), actBtn, sink); } catch (err) {}
      };
    });
    document.querySelectorAll("[data-merge]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        if (armed === b) {
          disarm();
          try { act(JSON.parse(b.getAttribute("data-merge")), b); } catch (err) {}
          return;
        }
        disarm();
        armed = b;
        b.className = "danger armed";
        btnSay(b, b.getAttribute("data-confirm"));
      };
    });
    document.querySelectorAll("[data-unwatch]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        if (armed === b) {
          disarm();
          try { act(JSON.parse(b.getAttribute("data-unwatch")), b); } catch (err) {}
          return;
        }
        disarm();
        armed = b;
        b.className = "danger armed";
        btnSay(b, b.getAttribute("data-confirm"));
      };
    });
    // run log (orch#151): plain single-click like [data-tail] via [data-act]
    // -- log is a read, not a destructive verb, so no arm-then-confirm.
    // Wired by hand (not through the generic [data-act] delegated handler
    // above) because that handler discards act()'s resolved value; this
    // needs the decoded body to render structured rows, so it chains its
    // own .then() onto the promise act() returns, exactly the use act()'s
    // own comment (~601) names.
    document.querySelectorAll("[data-run-log]").forEach(function (b) {
      var sink = b.getAttribute("data-sink");
      b.onclick = function (e) {
        e.stopPropagation();
        var body; try { body = JSON.parse(b.getAttribute("data-run-log")); } catch (err) { return; }
        act(body, b, null).then(function (d) {
          if (!d || !sink) return;
          run_log_text[sink] = runLogBody(d.runs || []);
          paintRunLog(sink);
        });
      };
    });
    // The generic text-and-send handler: plain single click like [data-act],
    // no arm-then-confirm -- these posts are additive (a comment, a note), not
    // destructive, so they do not need the friction unwatch/merge get.
    // Reads the sibling input's value at click time (the whole reason this is
    // not a plain [data-act] button) and clears the box on a successful post
    // so a second send does not resend the first by accident.
    //
    // It arrived with the reply box (#224) but is NOT that box's private
    // handler: it dispatches on whatever `action` the payload names, so any
    // control that wants "read the sibling input, post it, clear on success"
    // rides it. #292's per-repo leave-note box does exactly that (action
    // "ask"). #291 removed the QUESTIONS section and with it `replyBox`, the
    // handler's original emitter -- the handler itself stays, because the note
    // box is a live emitter on main and deleting this would silently turn that
    // box into an input and a button that post nothing.
    document.querySelectorAll("[data-reply]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var body; try { body = JSON.parse(b.getAttribute("data-reply")); } catch (err) { return; }
        var inputEl = $(body.input);
        var text = inputEl ? inputEl.value.trim() : "";
        if (!text) return;
        delete body.input;
        body.text = text;
        act(body, b, null).then(function (r) {
          if (r && r.ok && inputEl) inputEl.value = "";
        });
      };
    });
    // The reload button is rebuilt by every render (it lives in each page's
    // nav bar), so it is rewired here rather than once at load. It reloads
    // the PAGE - it is not a feed poll. That distinction is the whole point:
    // a page reload also picks up a new build of the page's own code, which a
    // feed fetch never does, and a stale served page has been a real failure
    // mode twice (#76). It therefore takes no origin check and is never
    // disabled: reloading is always possible, off-origin included (#83,
    // restoring the verdict of #36). The control stays visible for the reason
    // recorded in #66 - a hidden control cannot be told apart from one that
    // was never built.
    var reloadBtn = $("btn-reload");
    if (reloadBtn) { reloadBtn.onclick = function () { location.reload(); }; }
    // Restore every disclosure and every inline output box the last render
    // had open -- render() rebuilds the page from a string, so both would
    // otherwise be wiped by the poll act() schedules 1.2s after any action.
    Object.keys(open).forEach(function (id) {
      var dd = $(id); if (dd && open[id]) dd.className = "det on";
    });
    Object.keys(out_text).forEach(paintOut);
    Object.keys(run_log_text).forEach(paintRunLog);
  }

  function disarm() {
    if (!armed) return;
    armed.className = "danger";
    btnRestore(armed);
    armed = null;
  }
  document.addEventListener("click", disarm);

  // Same-origin only. In openclaw the page is sandboxed to origin `null`, and
  // the feed sends no CORS headers, so a fetch there fails no matter what the
  // CSP allows - and it does not need to, because the tick bakes the data in.
  // FEED is resolved AGAINST window.location, which is what lets it be
  // relative: `new URL(FEED)` alone throws on a relative path, and the catch
  // below would swallow that into a permanently-false SAME_ORIGIN - the exact
  // silent failure this is meant to end.
  var FEED_ORIGIN = (function () {
    try { return new URL(FEED, window.location.href).origin; }
    catch (e) { return null; }
  })();
  var SAME_ORIGIN = FEED_ORIGIN !== null && FEED_ORIGIN === window.location.origin;
  // Say WHY, with both origins named. A mismatch used to disable the update
  // path in silence, which is how a wrong port survived long enough to be
  // mistaken for three other bugs (#82). A wrong feed address must now be
  // readable on the page, not inferred from data that stopped moving.
  var FEED_REASON = SAME_ORIGIN ? "" : (FEED_ORIGIN === null
    ? "cannot resolve the feed address " + FEED + " against this page"
    : "feed origin " + FEED_ORIGIN + " does not match page origin "
      + window.location.origin + " — the page cannot fetch updates");
  if (!SAME_ORIGIN && window.console && console.warn) {
    console.warn("orch widget: " + FEED_REASON);
  }

  function poll() {
    if (!SAME_ORIGIN) return Promise.resolve();
    return fetch(FEED, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () {});
  }

  // Deep links must survive reload AND back/forward. A hash change is a pure
  // client-side navigation: repaint from the data already held, never refetch
  // -- the tick is the origin of new data, and a route change is not news.
  window.addEventListener("hashchange", function () {
    if (last_data) render(last_data);
  });

  // Recomputes the #age text from the stored stamp. This fetches NOTHING -
  // it is a clock, not a poll. There is deliberately no feed timer here.
  setInterval(paintAge, 10000);

  if (SEED) { try { render(SEED); } catch (e) {} }
  // One fetch on load, then nothing on a timer: a page-side refresh cadence
  // would compete with the tick's own. The tick is the origin; the reload
  // button is how the operator asks for fresh data. Do not add setInterval.
  if (SAME_ORIGIN) { poll(); }

  // /events pushes the same whole-feed object poll() fetches, on every feed
  // change, so the page repaints as the tick writes rather than waiting on
  // a refresh. This is the live path the "do not add setInterval" rule above
  // was steering toward: a push stream, not a poll cadence. The rule still
  // stands - the load-time poll() above is unchanged and is the fallback for
  // browsers with no EventSource and for the up-to-first-connect gap. Drops
  // are the browser's problem to reconnect; adding retry or a fallback timer
  // here would just be the forbidden poll loop wearing a disguise.
  if (SAME_ORIGIN && typeof EventSource !== "undefined") {
    var es = new EventSource("/events");
    es.onmessage = function (e) {
      try { render(JSON.parse(e.data)); } catch (err) {}
    };
  }
})();
</script>
</body>
</html>
