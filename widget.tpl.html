<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>orch</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d1117; color: #e8e8ea;
               -webkit-text-size-adjust: 100%; }
  body { padding: 14px; padding: max(14px, env(safe-area-inset-top))
                        max(14px, env(safe-area-inset-right))
                        max(14px, env(safe-area-inset-bottom))
                        max(14px, env(safe-area-inset-left)); }
  @media (prefers-color-scheme: light) {
    html:not([data-theme="dark"]), html:not([data-theme="dark"]) body {
      background: #0d1117;   /* the panel is dark by design; keep it legible */
    }
  }
</style>
</head>
<body>
<div id="orch">
  <style>
    /* ===================================================================
       THE SHAPE SYSTEM (docs/UX-REDESIGN.md section 3)
       -------------------------------------------------------------------
       Four shapes plus furniture. What is genuinely shared is ONLY: the
       type scale, the mark vocabulary (pills/dots), the verb slot, the
       vertical rhythm, and "wrap, never truncate".

       NOT shared: the grid. The previous design generalized one repo row
       into a universal table contract, which broke three times at phone
       width because journal entries, definition pairs, section headers and
       gap markers do not have that structure. So each shape below owns its
       own layout AND its own 390px fold rule, and there is deliberately no
       single universal media query. The definition pair (3.3) is fold-free
       by construction and no media query touches it.
       =================================================================== */

    /* Design tokens (docs/UX-REDESIGN.md artboard). Declared on #orch, not
       :root: every rule in this file is #orch-scoped by discipline, and a
       :root custom property would break that scoping for no gain. Artboard's
       own reason: "Every pad, gap and indent is a multiple, so nested
       elements land on the same vertical rhythm as their parents." */
    #orch { --u: 4px; --pad: 12px; --gap: 8px; --indent: 20px; --ctl: 24px; }
    /* Cap line length on wide screens (orch#186). Artboards are drawn at
       560px, but a live repo carries more issues than the artboards' three,
       and .er packs identity + state pill + age + two verbs on one line —
       560 would crowd it, so 880px instead. Left-aligned, not centred: this
       is a polling dashboard, and centring would shove content sideways on
       every window resize. */
    #orch { font: 13px/20px ui-sans-serif, system-ui, sans-serif; color: #e8e8ea; background: #0d1117; max-width: 880px; }
    #orch * { box-sizing: border-box; }
    #orch a { color: #58a6ff; text-decoration: none } #orch a:hover { color: #79c0ff; text-decoration: underline }

    /* --- shared: the mark vocabulary ---------------------------------- */
    /* Artboard says 8x8 (was 7x7). Sized here, not on .dot.auto, so the
       colour-only dot and the automerge-outlined dot never disagree on box
       size -- see orch#163 below for why the box size must never change
       depending on state. */
    #orch .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
    /* orch#163: the dot carries TWO independent facts. Colour is status
       (ok/off/bad below); the rounded-square outline means automerge is on.
       Verbatim from the original design note: "STATUS DOT = AUTOMERGE
       TOGGLE. Colour is status; the rounded-square outline means automerge
       is on. Tapping it flips automerge." An outline (not a border) is used
       so the box's own width/height never change -- the dot sits in a flex
       row and must not reflow the row when automerge flips.

       The artboard draws this same fact a second way -- `.st`/`.st.auto`, a
       20x20 box whose BORDER-color carries automerge-on. Not implemented
       here, deliberately: it and the outline above are two mechanisms for
       one fact, and orch#163's is the one wired to markup. Shipping the
       rival as unused CSS would invite a later session to wire it and leave
       the page drawing automerge two ways, free to disagree -- the exact
       failure this file's header comment describes. If the artboard's box
       is wanted, it REPLACES the outline in one change, markup included;
       it does not land beside it. Note the artboard's own 1px border does
       reflow a flex row, which is why orch#163 chose an outline. */
    #orch .dot.auto { outline: 1px solid #1f6feb; outline-offset: 1px; border-radius: 3px; cursor: pointer; }
    #orch .ok { background: #3fb950 } #orch .bad { background: #f85149 }
    #orch .off { background: #30363d }
    #orch .pulse { animation: p 1.6s ease-in-out infinite }
    @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    /* Status chips (artboard 1e). Formula: every chip background is its
       foreground hue at `33` alpha. One formula, six chips -- keep it when
       adding a state. */
    #orch .s { font-size: 11px; height: 18px; padding: 0 7px; border-radius: 20px;
               white-space: nowrap; font-weight: 500; display: inline-flex; align-items: center; }
    #orch .ACTIVE { background: #1f6feb33; color: #79c0ff }
    #orch .CLAIMED { background: #8957e533; color: #d2a8ff }
    #orch .REVIEW { background: #23863633; color: #7ee787 }
    #orch .CHECKING { background: #9e6a0333; color: #e3b341 }
    #orch .BLOCKED, #orch .ABANDONED { background: #da363333; color: #ff7b72 }
    #orch .LANDED { background: #23863633; color: #7ee787 }
    /* #87: UNCLAIMED reaches a pill now that one pill carries both axes.
       It had no rule before because only work_state was rendered here and
       work_state has no such value -- an unstyled pill would have been bare
       text. Neutral grey on purpose: nobody holds it, so it is not a state
       anything is happening in. */
    #orch .UNCLAIMED { background: #6e768126; color: #a8b1bb }
    /* The loud mark: a needs-you row's condition level. Not a state pill --
       a condition is a judgement the FEED made, the pills are derived state. */
    #orch .lvl-error { color: #ff7b72 } #orch .lvl-warn { color: #e3b341 }
    #orch .lvl-info { color: #58a6ff }

    /* --- shared: the verb slot ---------------------------------------- */
    /* One button style everywhere. Artboard 1d fixes controls to a 24px
       box ("var(--ctl)") -- its stated reason: "so rows never change
       height." A verb appearing/disappearing must not reflow the list.
       This supersedes the previous 28px min-height (a thumb-target rule);
       the artboard's fixed-height requirement wins because a variable
       height per verb count is exactly what it rules out. */
    /* a.btn rides the SAME declarations as button, never a copy of them: the
       verb slot mixes real buttons with link-verbs (verbLink) and the two must
       stay pixel-identical beside each other in one row. A second block would
       drift the moment either is touched. The extras below `cursor` are what
       an <a> does not inherit from a <button>. */
    #orch button, #orch a.btn { font: inherit; font-size: 12px; height: var(--ctl); padding: 0 8px;
                   border-radius: 6px; border: 1px solid #30363d; background: #21262d;
                   color: #c9d1d9; cursor: pointer;
                   display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
                   box-sizing: border-box }
    #orch button:hover, #orch a.btn:hover { background: #30363d; border-color: #8b949e }
    /* Artboard's quiet control variant: same box, muted text. */
    #orch button.q, #orch a.btn.q { color: #8b8b95 }
    /* Artboard's icon control: the 24px box squared off, no horizontal
       padding, glyph centered.

       These two match no markup YET -- nothing emits class `q` or `icon`.
       Kept, where .e.head and .st were not, because the operator's own
       ruling names icon verbs as already specified: this is the box the
       controls land in, and the control that fills it belongs to orch#257.
       Geometry here, control there, per that division. If #257 resolves
       some other way, these come out with it rather than lingering. */
    #orch button.icon, #orch a.btn.icon { width: var(--ctl); padding: 0;
                   display: inline-flex; align-items: center; justify-content: center }
    #orch button.danger:hover { background: #da3633; border-color: #f85149; color: #fff }
    #orch button.danger.armed { background: #da3633; border-color: #f85149; color: #fff }
    #orch button.danger.armed:hover { background: #f85149; border-color: #ff7b72 }
    /* Deliberately muted/neutral, never the danger colour: a dismiss is a
       per-browser display preference (#106), not a repo act, and must not
       read as the risky control next to it. */
    #orch button.ghost { color: #8b949e; background: #21262d; border-color: #30363d }
    #orch button.ghost:hover { color: #c9d1d9; background: #30363d; border-color: #484f58 }
    #orch button[disabled] { opacity: .4; cursor: not-allowed }
    #orch button[disabled]:hover { background: #21262d; border-color: #30363d }
    /* orch#163: the automerge dot is a <span data-act>, not a <button> --
       it must not grow the row's box (see .dot.auto above), so it cannot
       be a real form control. `disabled` on a span is inert for the
       browser's native click-suppression (act() itself still no-ops via
       CAN_ACT, see :503), but it still needs the same visual "can't act
       right now" cue every button[disabled] gets. */
    #orch .dot[disabled] { opacity: .4; cursor: not-allowed }
    #orch .verbs { display: flex; gap: 6px; align-items: center; flex: none }

    /* --- shared: type + rhythm ---------------------------------------- */
    #orch .m { color: #8b8b95; font-size: 12px }
    #orch .k2 { font-family: ui-monospace, monospace; font-size: 11px; color: #c9d1d9;
                overflow-wrap: anywhere }
    #orch .disabled { color: #6e7681; cursor: not-allowed }

    /* ===== 3.1 ENTITY ROW ==============================================
       [mark] [identity] [status/what ……] [age] [verbs 0-2]
       Its OWN grid: five columns, identity and status take the slack.
       Columns per the artboard: [dot] .n name | .w sub | .a age | .v verbs
       -- mapped onto this file's existing area names (mark/id/what/age/
       verbs), not renamed, since no markup here emits the artboard's
       shorter class names. Row height fixed at 32px, every row, every
       section, per the artboard: a variable-height row is exactly what a
       fixed-height control box (1d, .btn) exists to prevent reflow for.

       The 6px padding is load-bearing, not taste: 6 + the 20px line-height
       + 6 lands a single-line row on exactly 32px, so min-height is the
       floor a wrapped row grows from rather than a number nothing reaches.
       At the 7px it was, every row rendered 34px and the 32px never bound
       -- a 2px error that compounds down a long list. Retune the padding
       and the line-height together or the row leaves the artboard's
       rhythm. */
    #orch .er { display: grid; align-items: baseline; column-gap: var(--gap); row-gap: 3px;
                /* orch#340: id is minmax(<floor>,auto), what is the 1fr.
                   NOT the other way round -- `auto` outranks `1fr` for content
                   width, so when id was the 1fr and what was auto, what took
                   its full natural width first and id got the remainder, with
                   minmax(0,...) letting it collapse toward zero. A 132px repo
                   slug rendered in 65px and overflow-wrap: anywhere broke it
                   one character per line. Identity is the scan column and
                   takes its natural width; what is prose and yields, which is
                   what its overflow-wrap is for. Five tracks, five areas --
                   the count the fold and the sub-line rule depend on is
                   unchanged, this is sizing only. */
                grid-template-columns: 20px minmax(12ch,auto) minmax(0,1fr) auto auto;
                grid-template-areas: "mark id what age verbs";
                min-height: 32px; padding: 6px 0; border-top: 1px solid #202027 }
    /* orch#289 (part 4): the journal-tail sub-line. A SECOND GRID ROW, not a
       sixth column -- the comment above and the 390px fold below both depend
       on exactly five areas / three columns at the fold, and a new column
       would break both. Spans every content column except mark, so it lines
       up under identity/what rather than under the dot. Emitted only when
       entityRow's `sub` is truthy (see entityRow below), so the grid's own
       row collapses to nothing and every caller that never passes `sub`
       stays byte-identical. */
    #orch .er.has-sub { grid-template-areas: "mark id   what  age verbs"
                                              "mark sub  sub  sub  sub" }
    #orch .er > .er-mark { grid-area: mark; align-self: center }
    #orch .er > .er-sub  { grid-area: sub; color: #6e7681; font-size: 12px;
                            overflow: hidden; text-overflow: ellipsis;
                            white-space: nowrap }
    /* The repo fold's disclosure glyph (#160 review finding 4): lives INSIDE
       er-mark next to the live dot, never a grid column of its own -- the
       .er grid above has exactly five areas and neither this rule nor the
       390px fold below touches that count. Only repoRow() emits it (an
       unreachable repo has no toggle and gets no glyph), so this is a
       styling hook, not a structural one. */
    #orch .er > .er-mark .fold-mark { color: #6e7681; font-size: 10px; margin-right: 2px;
                                       display: inline-block; width: 8px }
    #orch .er > .er-id   { grid-area: id; font-weight: 500; overflow-wrap: anywhere }
    #orch .er > .er-what { grid-area: what; color: #a8b1bb; overflow-wrap: anywhere }
    /* orch#289 (part 3): display_name renders alongside the full title, not
       instead of it -- .dim is the title's secondary weight, same #8b8b95
       used elsewhere in this file for de-emphasized text (.er-age, .sh-t). */
    #orch .er .dim { color: #8b8b95 }
    /* Artboard's .a: tabular-nums, right-aligned, min-width 34px so the age
       column never jitters as digit count changes. */
    #orch .er > .er-age  { grid-area: age; color: #8b8b95; font-size: 12px; white-space: nowrap;
                            font-variant-numeric: tabular-nums; text-align: right; min-width: 34px }
    #orch .er > .er-verbs{ grid-area: verbs; display: flex; gap: 6px; align-items: center }
    /* The light variant: WHAT MOVED rows and AVAILABLE rows. No mark, no
       verbs, dimmed -- secondary weight is a colour change, not a second
       grid (section 4.1: AVAILABLE is "visible but visually lighter"). */
    #orch .er.lite { color: #8b8b95 } #orch .er.lite > .er-id { font-weight: 400 }
    /* The loud variant: a needs-you row. Dominant weight, per 4.1. */
    #orch .er.loud > .er-id { font-weight: 600; color: #fff }
    #orch .er.loud > .er-what { color: #e8e8ea }
    /* The repo row (artboard's .e.repo): heavier, its own ground.
       `.repo` is IDENTITY -- this row is a repo -- and is applied to every
       repo row in both sections. `.toggle` is AFFORDANCE -- this row folds
       something -- and is applied only when there is a .det block to fold
       (#259). They were one class until a paused repo needed the first
       without the second: an AVAILABLE repo has issues: [], so it folds
       nothing, but it is still a repo and must not render as a bare nested
       row. Keep them separate; a selector that means two things cannot be
       given to a row that is only one of them. */
    #orch .er.repo { background: #12161c; border-top: 1px solid #30363d }
    #orch .er.repo > .er-id { font-weight: 600; font-size: 14px }
    #orch .er.repo > .er-what .k2 { font-family: ui-monospace, monospace; font-size: 11px; color: #6e7681 }
    /* The nest variant (#150): an issue row one level under its repo. SAME
       cells as any entity row (3.1) -- only the left inset changes, via
       padding rather than a grid-column shift, so the 390px fold rule below
       applies unchanged and needs no rule of its own.
       GOVERNING RULE from the artboard: "indent only the identity, keep
       every other column aligned." ONLY the identity cell gets the indent
       -- age and verbs stay in their columns across every row type, so the
       padding lands on .er-id, not on .er.nest itself (which would shift
       the whole grid, including age/verbs, out of their columns). */
    #orch .er.nest { border-top: 1px solid #101013 }
    #orch .er.nest > .er-id { padding-left: var(--indent) }
    /* The artboard's third row variant, .e.head -- a section-adjacent row
       with a plain top border and no weight change -- is NOT implemented.
       Nothing emits it: entityRow's cls is only ever loud/toggle/nest/lite.
       Same standard the .st box was held to above; a rule matching no
       markup is not transcription, it is a guess at what a later markup
       change will want. It lands with the markup that needs it. */
    /* 3.1's fold, and ONLY 3.1's. Line 1 = mark + identity + age, with the
       age still top-RIGHT so the scan column survives the fold. Line 2 =
       status/what, wrapping freely. Line 3 = verbs, right-aligned, and the
       row only reserves that line when verbs actually exist (the grid's
       last row collapses to nothing when .er-verbs is absent). */
    @media (max-width: 390px) {
      #orch .er { grid-template-columns: auto 1fr auto;
                  grid-template-areas: "mark id  age"
                                       "what what what"
                                       "verbs verbs verbs" }
      #orch .er > .er-verbs { justify-content: flex-end; margin-top: 2px }
      /* orch#289: the sub-line gets its own full-width row here too, same
         reasoning as the age/what/verbs rows above it. */
      #orch .er.has-sub { grid-template-areas: "mark id  age"
                                                "what what what"
                                                "sub  sub  sub"
                                                "verbs verbs verbs" }
    }

    /* ===== 3.2 LOG ROW =================================================
       [time] [actor] [message ……] -- time LEADS because time is the
       identity of a log entry. No mark, no verbs, no state. */
    #orch .lg { display: grid; align-items: baseline; column-gap: 10px; row-gap: 2px;
                grid-template-columns: auto auto 1fr;
                grid-template-areas: "time actor msg";
                padding: 5px 0; border-top: 1px solid #16161a }
    #orch .lg > .lg-time  { grid-area: time; font-family: ui-monospace, monospace;
                            font-size: 11px; color: #8b8b95; white-space: nowrap }
    #orch .lg > .lg-actor { grid-area: actor; color: #6e7681; font-size: 12px; white-space: nowrap }
    #orch .lg > .lg-msg   { grid-area: msg; overflow-wrap: anywhere }
    /* The gap marker is this shape's DIVIDER: full width, no cells, cannot
       break at any width -- which is why it is a sibling rule and not a
       variant of the .lg grid above. */
    #orch .lg-gap { padding: 8px 0 6px; color: #6e7681; font-size: 11px;
                    text-align: center; letter-spacing: .02em;
                    border-top: 1px solid #16161a }

    /* 3.2's fold, and ONLY 3.2's: line 1 = time + actor, message wraps
       below at full width. Nothing else changes. */
    @media (max-width: 390px) {
      #orch .lg { grid-template-columns: auto 1fr;
                  grid-template-areas: "time actor"
                                       "msg  msg" }
    }

    /* ===== 3.3 DEFINITION PAIR ==========================================
       [label] [value ……] -- the issue page's state block. FOLD-FREE BY
       CONSTRUCTION: the label column is short and fixed, values wrap in
       place, a value's control wraps to its own line if it must. There is
       deliberately NO media query for this shape anywhere in this file. */
    #orch .dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px;
                margin: 4px 0 10px }
    #orch .dl > dt { color: #6e7681; white-space: nowrap }
    #orch .dl > dd { margin: 0; color: #c9d1d9; overflow-wrap: anywhere;
                     display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }

    /* ===== 3.4 SECTION HEADER ===========================================
       [title (count)] [controls] -- a title governing the rows below it.
       28px tall (artboard 1c). Label #c9d1d9/600/.03em is the title's own
       weight; the (count) suffix stays the dimmer #8b8b95 -- see .sh-t's
       child rule below, since title and count share one text node's worth
       of markup here (sectionHead() concatenates them into .sh-t) and the
       count needs its own span to take a different colour from the title
       it follows. */
    #orch .sh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
                min-height: 28px; margin: 14px 0 2px; padding-bottom: 2px;
                border-bottom: 1px solid #30363d;
                font-size: 12px; color: #8b8b95;
                font-weight: 600; letter-spacing: .03em; text-transform: uppercase }
    #orch .sh .sh-t { flex: none; color: #c9d1d9 }
    #orch .sh .sh-c { margin-left: auto; display: flex; gap: 4px; align-items: center;
                      flex-wrap: wrap; text-transform: none; letter-spacing: normal }
    #orch .sh.primary { color: #c9d1d9; font-size: 12px }
    /* Reduced weight: WHAT MOVED's outcome sub-headings (Landed/Moved/Not
       started) are this shape, quieter. The group IS the structure, so it
       gets a real header rather than a label jammed into an identity cell. */
    #orch .sh.sub { margin: 10px 0 0; text-transform: none; letter-spacing: normal;
                    color: #6e7681; font-size: 12px }
    #orch .sh.toggle { cursor: pointer } #orch .sh.toggle:hover { color: #c9d1d9 }
    /* #160: a repo row is also a toggle (folds its nested issue rows) --
       same affordance as .sh.toggle above, on the entity-row shape instead. */
    #orch .er.toggle { cursor: pointer } #orch .er.toggle:hover { color: #c9d1d9 }

    /* 3.4's fold, and ONLY 3.4's: controls wrap to a second line under the
       title; chips wrap, they never scroll horizontally. */
    @media (max-width: 390px) {
      #orch .sh .sh-c { margin-left: 0; flex-basis: 100% }
    }

    /* ===== 3.5 FURNITURE ================================================
       Full-width single-cell lines with no grid at all: quiet-state lines,
       the resume code line, the steering link, empty-state hints, the
       footer. Cannot break at any width because nothing is aligned. */
    #orch .fu { padding: 7px 0; color: #8b8b95; overflow-wrap: anywhere }
    #orch .fu.quiet { color: #7ee787 }
    #orch .fu.cond { color: #ff7b72; font-weight: 500 }
    #orch .fu.code { font-family: ui-monospace, monospace; font-size: 11px;
                     background: #16161a; border-radius: 6px; padding: 8px 10px;
                     color: #c9d1d9; user-select: all }
    #orch .fu.struck { color: #6e7681; text-decoration: line-through }
    #orch .fu.hint { color: #6e7681; font-size: 12px }

    /* --- navigation chrome: a back-link plus a title. No breadcrumbs:
       at two clicks of maximum depth a breadcrumb system is decoration
       (section 2). --------------------------------------------------- */
    #orch .nav { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
                 padding-bottom: 8px; border-bottom: 1px solid #2a2a30; margin-bottom: 4px }
    #orch .nav .t { font-weight: 600; font-size: 15px; letter-spacing: -.01em }
    /* orch#116: the checkout path is the only unambiguous repo identifier --
       repos.txt is machine-local and one slug can map to several working
       trees. user-select:all because reaching a repo means pasting this
       into a shell, so one click must take the whole path. */
    #orch .nav .rpath { font-family: ui-monospace, monospace; font-size: 11px;
                        color: #8b8b95; user-select: all; overflow-wrap: anywhere }
    #orch .nav .right { margin-left: auto; display: flex; gap: 8px; align-items: baseline }

    /* Inline verb output. The global page-bottom #out pre is CUT (section
       7): output renders at its cause, which on the issue page is the
       ACTIONS block. */
    #orch .out { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11px;
                 color: #8b8b95; max-height: 220px; overflow: auto; margin: 6px 0 0;
                 padding: 8px; background: #16161a; border-radius: 6px }
    #orch .out:empty { display: none }

    #orch .foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
                  margin-top: 18px; padding-top: 8px; border-top: 1px solid #2a2a30;
                  font-size: 12px; color: #8b8b95 }
    #orch .foot .right { margin-left: auto; display: flex; gap: 10px; align-items: center }
    #orch .ro { font-size: 11px; color: #6e7681; margin-top: 8px }
    #orch .det { display: none } #orch .det.on { display: block }
    #orch .wks { margin: 2px 0 2px 16px; color: #8b8b95; font-size: 12px }
    /* The blocking review findings (#117). pre-wrap because these are
       agent-authored prose whose
       own line breaks carry meaning -- a note reflowed into one paragraph
       loses the structure the agent wrote it with. */
    #orch .note { margin: 2px 0 6px 16px; color: #c9d1d9; font-size: 12px;
                  white-space: pre-wrap; word-break: break-word;
                  border-left: 2px solid #30363d; padding-left: 8px }

    /* Text scales UP under 390px, never down (section 3, "what is genuinely
       shared"). One rule, on the root, because it is the type scale -- not
       a per-shape fold. */
    @media (max-width: 390px) {
      #orch { font-size: 14px }
    }

<script>
(function () {

  // the origin is not this file's to know. An absolute literal carrying a
  // port cannot be right on a machine where the port is ORCH_PORT: the two

  var SEED = __SEED__;

  // approval, no re-staging - and where /act is absent it stays a viewer.
  // CAN_ACT no longer decides whether a control EXISTS, only whether it is
  // usable: every control is always emitted (#66). ACT_REASON carries why a
  // control is dead, so the operator reads a cause instead of a blank page.
  var CAN_ACT = false;
  var ACT_REASON = "checking whether this page can act…";

  // first render(SEED), so it needs something to repaint FROM when it cannot
  // poll - off-origin poll() is a no-op, which is exactly why the old code
  // never flipped a real browser out of its button-less first paint.

    .then(function (r) { return r.json(); })
    .then(function (d) {

    .catch(function (e) {

      // controls are inert, and the operator can only act on a named cause.

    });

  // FEED_ORIGIN it is derived from (#82) - is a var assigned during this same
  // IIFE body, all before any fetch callback can run.

  // needs a sentence. actAttrs() emits its own title when the page cannot

  // `!attrs` from the SAME actAttrs() result the tag already carries.

  // cause: fix that and the specific reason may resolve itself.

  // disabled with the reason, so the operator reads "not built yet" instead
  // of wondering where the button went. Deliberately NOT actAttrsIf: the
  // page-wide probe reason is irrelevant here, the control is dead on a

  // rebuilds the whole page from an HTML string, so "which disclosure is
  // open" cannot live in the DOM -- the next poll would wipe it.
  var open = {};
  // Seed repo fold state from localStorage (#160) BEFORE the first render:
  // `open` records what is OPEN, the FOLD_KEY store records what is FOLDED,
  // so a repo is open unless the store names it -- an empty/corrupt store
  // (foldedSet() returns {}) seeds nothing here, which is exactly the
  // expanded-by-default posture #66 requires. This only ever ADDS keys
  // carrying the "rp-" prefix (see foldId() below -- checked here as a
  // literal, not by calling foldId(), because foldId is declared further
  // down the file and this IIFE runs before that assignment executes), so
  // it cannot clobber the unrelated "dun" (other sessions) entry, which is
  // seeded lazily by the click handler instead and is never persisted. A

  // not copied in, which is what keeps this loop honest against its own
  // comment (#160 review finding 2).

    var folded = foldedSet();

  })();
  // Per-issue verb output, keyed by idsafe(slug)+issue, held out of the DOM
  // for the same reason: a 30s poll would erase a tail the operator is
  // reading. The global #out pre is CUT (section 7), so this is where
  // tail output lives -- at its cause, on the issue page.
  var out_text = {};
  // The RUN LOG section's fetched body, same held-out-of-DOM reason as
  // out_text (poll wipes the box every 30s) but a SEPARATE store: out_text
  // holds tail's raw text, painted via textContent; this holds runLogBody's
  // pre-escaped HTML, painted via innerHTML (orch#151). One store per paint
  // method, so a future out_text value can never be run through innerHTML
  // by accident.
  var run_log_text = {};
  // MIRRORS orch/server.py's SLUG regex exactly, including the length bound
  // -- server.py rejects any /act path that fails this after stripping every
  // "~" (Python's str.replace has no count limit, hence the /g flag here).
  // Any control that sends a slug must refuse to offer a path the server
  // will reject, so these two must stay in step: changing one without the
  // other reintroduces #75.
  var SLUG_OK = /^[A-Za-z0-9._\/-]{1,120}$/;
  var armed = null;
  // The feed's own `generated` stamp, kept outside the DOM so the age readout
  // can be recomputed between renders without refetching anything.
  var generated_at = null;
  // The idle threshold, read from the feed. The old hardcoded 25 is CUT
  // (section 7): the feed exports the one real number, and a client-side
  // copy is a second threshold that can disagree with the tick's.
  var NUDGE_IDLE_MINS = null;

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {

  var idsafe = function (s) { return String(s).replace(/\W/g, ""); };
  // The repo fold's OWN id builder (#160 review finding 1) -- NOT idsafe()
  // above. idsafe() DELETES every non-word character, so "cybermelons/orch-
  // web" and "cybermelons/orchweb" both collapse to "cybermelonsorchweb":
  // idsafe's other call site (the per-issue output sink, ~line 1435) just
  // gets a wrong object key when two slugs collide there, which is a quiet
  // bug. Here the same collision is a stronger failure -- two repo rows
  // would render the SAME DOM id, so getElementById resolves only the
  // first and the second row's toggle is dead -- so the fold needs an id
  // builder that is actually injective. Every non-word character is
  // replaced with its own escape (`_<charCode>_`) instead of dropped, so
  // two distinct slugs can never produce the same encoded tail. The "rp-"
  // prefix carries a delimiter (a hyphen, valid in an HTML id) so the
  // prefix test in wire() (~line 1574) cannot misfire against some future
  // unrelated id that merely starts with "rp".
  var foldId = function (slug) {
    return "rp-" + String(slug).replace(/\W/g, function (c) { return "_" + c.charCodeAt(0) + "_"; });
  };
  var mins = function (m) { return m == null || m < 0 ? "—" : m < 60 ? m + "m" : (m / 60).toFixed(1) + "h"; };
  // A negative commit count is the feed saying it could not READ the count --
  // not a real zero. Zero commits is a conclusion an operator acts on ("the
  // agent produced nothing"), so a failed read must never render as one. Same
  // convention as mins() above. See STATES.md finding 10.
  var commits = function (c) { return c == null || c < 0 ? "—" : c; };
  var secs = function (s) {
    return s == null ? "—" : s < 90 ? s + "s" : s < 5400 ? Math.round(s / 60) + "m" : (s / 3600).toFixed(1) + "h";
  };
  var clock = function (iso) {
    if (!iso) return "?";
    var d = new Date(iso);
    return isNaN(d) ? "?" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  };
  var dot = function (alive, cls) { return '<span class="dot ' + (alive ? "ok" : "off") + (cls || "") + '"></span>'; };
  // orch#163: the issue-row dot, extended. Colour is still liveness alone
  // (dot()'s job, untouched above); this ADDS the automerge fact as the
  // rounded-square outline (.dot.auto, see the CSS comment) and makes the
  // dot itself the toggle -- same [data-act] path every other control uses
  // (act() at :514, delegated at :1501-1526), so it gets stopPropagation
  // and disabled-when-CAN_ACT-false for free. `i.auto_land` is the ONLY
  // signal read here for the VALUE -- never i.labels; precedence for
  // automerge lives server-side in exactly one home (core.py), not
  // duplicated here. orch#284 adds i.auto_land_source for the LABEL only:
  // it too is computed server-side beside auto_land, so this still reads a
  // decided answer rather than re-deriving precedence from labels.
  var autoDot = function (i, slug) {
    var alive = i.orch_alive, on = !!i.auto_land;
    var cls = (alive ? "ok" : "off") + (alive ? " pulse" : "") + (on ? " auto" : "");
    var payload = esc(JSON.stringify({ action: "set_auto_land", repo: slug, issue: i.issue, on: !on }));
    // orch#284: the per-issue value overrides the repo default in BOTH
    // directions (on-over-off and off-over-on), so if "inherited" and "set
    // on the issue" rendered the same label, the operator could not tell
    // whether flipping THIS control changes anything at all. The suffix is
    // the tell: "(from repo)" means the dot mirrors the repo default and
    // toggling it will set an issue-level override; "tap to toggle" means
    // the issue already carries its own value.

    // never carries two title attributes. data-no-btn tells the delegated
    // click handler to call act() with btn=null for this control -- the dot

  function span(sec) {

  // kill that was denied all looked identical to a click that never happened
  // (the silent-no-op class of #93/#130/#149).
  //

  // -- is state, and renders as issue state (#166). It must never toast.

      }, 12000);

  // is FOLDED, not what is open. That direction matters for #66's safe-
  // degradation rule -- a store that throws, or reads back corrupt, must
  // degrade to the SAFE state, and the safe state here is "nothing folded",
  // i.e. every repo expanded (the operator's ruling on #160: expanded is

    try { localStorage.setItem(FOLD_KEY, JSON.stringify(obj)); } catch (e) {}
  }

  // Returns the promise of the decoded response so a caller that needs the

  // a resolved promise carrying null is handed back, so a chained caller can
  // still run its own rendering without a special case for the dead page.
  //

  // CUT (section 7) -- output renders at its cause -- so a verb that produces
  // text passes the out_text key of the block that asked for it.
  // ---- transient button text, without dropping the accessible name -----
  // A verb button's visible content is now a glyph in an aria-hidden span,
  // so the old raw textContent write had two costs beyond losing the
  // markup: it replaced the span with a bare text node (un-hiding the glyph
  // from assistive tech for good), and it left aria-label announcing the
  // ORIGINAL action while the button visibly read "…"/"done"/"failed". The

    // disarm() can both restore, and whichever runs first must find it.

      b.setAttribute("data-was-html", b.innerHTML);
      if (b.hasAttribute("aria-label")) {
        b.setAttribute("data-was-label", b.getAttribute("aria-label"));
      }

    // button announcing its un-armed name is the confirm step going silent.

    var html = snap && snap.html != null ? snap.html : b.getAttribute("data-was-html");

    if (html != null) b.innerHTML = html;
    if (label != null) b.setAttribute("aria-label", label);
    else if (html == null) b.textContent = "?";
    b.removeAttribute("data-was-html");
    b.removeAttribute("data-was-label");
  }
  function act(body, btn, sink) {
    if (!CAN_ACT) return Promise.resolve(null);
    // What the toast names. The action alone is too thin to act on when two
    // rows offer the same verb, so carry the target the payload already
    // carries: `repo`/`issue` for the issue verbs, `path` for unwatch, `file`
    // for tail. `tick` has no argument and is named by its verb alone.

    return fetch("/act", { method: "POST", body: JSON.stringify(body) })
      // A non-JSON body is a real case, not a parse bug: a dead proxy answers
      // 502 in HTML, and r.json() on that rejects with "Unexpected token '<'"
      // -- a cause that names the parser instead of the server. Read the text
      // once and report the STATUS when it will not decode.
      .then(function (r) {
        return r.text().then(function (t) {

              + " (response was not JSON)");

        if (btn) btnSay(btn, d.ok ? "done" : "failed");

        // "failed" on a button is not that cause. Same field order as

  // on the poll act() schedules 1.2s later, so a tail the operator is reading
  // would vanish unless it is repainted from the store.
  function paintOut(sink) {
    var box = $("o" + sink);
    if (box) box.textContent = out_text[sink] || "";
  }

  // not textContent, because run_log_text holds runLogBody's markup, not
  // raw text -- every interpolated field in that markup is esc()'d at
  // build time, same as every other innerHTML write in this file.
  function paintRunLog(sink) {
    var box = $("rl" + sink);
    if (box && run_log_text.hasOwnProperty(sink)) box.innerHTML = run_log_text[sink];
  }

  // ---- routing (section 2) -------------------------------------------
  // Three hash routes, kept not by inheritance but because they earn it in
  // ~10 lines: deep-linking, reload-keeps-place, free back/forward.
  //   #/            the machine page
  //   #/<slug>      one repo
  //   #/<slug>/<n>  one issue
  // Anything unparseable falls back to the machine page rather than
  // rendering a blank: a bad hash is a typo, not a state worth showing.
  function route() {
    var h = String(location.hash || "").replace(/^#\/?/, "");
    if (!h) return { page: "machine" };
    var parts = h.split("/").filter(function (p) { return p !== ""; });

    // hash that could never name a real repo takes the fallback instead of
    // rendering an empty repo page that looks like a repo with no issues.
    if (!parts.length || !SLUG_OK.test(decodeURIComponent(parts[0]))) return { page: "machine" };
    var slug = decodeURIComponent(parts[0]);
    if (parts.length === 1) return { page: "repo", slug: slug };
    if (/^\d+$/.test(parts[1])) return { page: "issue", slug: slug, issue: parseInt(parts[1], 10) };
    return { page: "repo", slug: slug };
